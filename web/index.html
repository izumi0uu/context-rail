			activeItems: timeline.activeIds.length,
			historyItems: timeline.history.length,
			updatedAt: Date.now(),
		}],
		changed: { streamId: "legacy:default", state },
	});
}

function connectEventSource() {
	if (eventSource) return;
	const eventsUrl = new URL("/events", location.href);
	if (eventCapabilityToken) eventsUrl.searchParams.set("token", eventCapabilityToken);
	const source = new EventSource(eventsUrl.href);
	eventSource = source;
	source.addEventListener("open", () => {
		if (eventSource === source) setConnection("live", "live");
	});
	source.addEventListener("bootstrap", (event) => {
		handleEventSourceMessage(source, event, applyHubPayload);
	});
	source.addEventListener("update", (event) => {
		handleEventSourceMessage(source, event, applyHubPayload);
	});
	source.addEventListener("snapshot", (event) => {
		handleEventSourceMessage(source, event, applyLegacySnapshot);
	});
	source.addEventListener("error", () => {
		if (eventSource === source) setConnection("offline", "reconnecting");
	});
}

const query = new URLSearchParams(location.search);
if (query.get("demo") === "1") {
  setConnection("live", "demo");
  const primary = demoPayload();
  const compacted = structuredClone(primary);
  compacted.snapshot.model = "gpt-5.4";
  compacted.snapshot.tokens = 118400;
  compacted.snapshot.percent = 59.2;
  compacted.phase = "tool";
  compacted.activeTools = ["search"];
  const idle = structuredClone(primary);
  idle.snapshot.model = "claude-opus-4.1";
  idle.snapshot.tokens = 42100;
  idle.snapshot.percent = 21.05;
  idle.phase = "idle";
  const demoSessions = [
    { streamId: "process-a:session-alpha", processId: "process-a", processLabel: "context-rail", sessionId: "session-alpha", sessionLabel: "Main build", active: true, connected: true, phase: primary.phase, model: primary.snapshot.model, activeItems: primary.timeline.activeIds.length, historyItems: primary.timeline.history.length, updatedAt: Date.now() },
    { streamId: "process-b:session-beta", processId: "process-b", processLabel: "api-worker", sessionId: "session-beta", sessionLabel: "Hub protocol", active: true, connected: true, phase: compacted.phase, model: compacted.snapshot.model, activeItems: compacted.timeline.activeIds.length, historyItems: compacted.timeline.history.length, updatedAt: Date.now() - 1000 },
    { streamId: "process-a:session-archive", processId: "process-a", processLabel: "context-rail", sessionId: "session-archive", sessionLabel: "Earlier session", active: false, connected: true, phase: idle.phase, model: idle.snapshot.model, activeItems: idle.timeline.activeIds.length, historyItems: idle.timeline.history.length, updatedAt: Date.now() - 2000 },
  ];
  applyHubPayload({
    type: "bootstrap",
    activeStreamId: demoSessions[0].streamId,
    sessions: demoSessions,
    states: [
      { streamId: demoSessions[0].streamId, state: primary },
      { streamId: demoSessions[1].streamId, state: compacted },
      { streamId: demoSessions[2].streamId, state: idle },
    ],
  });
} else connectEventSource();

globalThis.__contextRail = {
  diagnostics: () => ({
    connected: $("#connection").dataset.state,
    mode: viewMode,
		selectedStreamId,
		activeStreamId,
		followActive,
		pendingDeltaStreams: [...deltaTransfers.keys()],
		sessions: sessionSummaries.map((summary) => ({ ...summary })),
		historyIds: [...nodes.keys()],
		activeIds: [...nodes.values()].filter((node) => node.item.active).map((node) => node.key),
		inactiveIds: [...nodes.values()].filter((node) => !node.item.active && !node.item.pending).map((node) => node.key),
		pendingIds: [...nodes.values()].filter((node) => node.item.pending).map((node) => node.key),
		detail: {
			streamId: detailSelection?.streamId || null,
			itemId: detailSelection?.itemId || null,
			open: document.body.dataset.detailOpen === "true",
			state: $("#detail-state").textContent,
			role: $("#detail-role").textContent,
			text: detailContent.textContent,
		},
		queuedIds: [...nodes.values()].filter((node) => !node.revealed).map((node) => node.key),
		positions: Object.fromEntries([...nodes.values()].map((node) => [node.key, {
			homeX: node.homeX,
			homeY: node.homeY,
			focusX: node.focusX,
			focusY: node.focusY,
			targetX: node.targetX,
			targetY: node.targetY,
		}])),
    edges: edges.size,
			renderLoop: {
				active: renderLoopActive,
				scheduled: animationFrameId !== null,
				driver: animationFrameId === null ? null : animationFrameUsesTimeout ? "timeout" : "raf",
			movingNodes: movingNodes.size,
			dirtyEdges: dirtyEdges.size,
			frames: renderStats.frames,
			lastFrameAt: renderStats.lastFrameAt,
			lastFrame: {
				nodeUpdates: renderStats.lastFrameNodeUpdates,
				edgeUpdates: renderStats.lastFrameEdgeUpdates,
			},
			peakFrame: {
				nodeUpdates: renderStats.peakFrameNodeUpdates,
				edgeUpdates: renderStats.peakFrameEdgeUpdates,
			},
			totalUpdates: {
				nodes: renderStats.totalNodeUpdates,
				edges: renderStats.totalEdgeUpdates,
			},
			sleepingForMs: renderLoopActive || renderStats.sleepingSince === null
				? 0
				: Math.max(0, Math.round(performance.now() - renderStats.sleepingSince)),
		},
    phase: document.body.dataset.phase,
    frame: { ...frameTarget },
  }),
};

document.addEventListener("visibilitychange", () => {
  if (document.hidden && animationFrameId !== null && !animationFrameUsesTimeout) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
    scheduleRender();
  } else if (!document.hidden && (movingNodes.size || dirtyEdges.size || cameraDirty || frameDirty)) {
    scheduleRender();
  }
});

scheduleRender();
