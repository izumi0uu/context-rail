<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ContextRail</title>
<style>
  :root {
    --canvas: #f7f8f6;
    --surface: #ffffff;
    --ink: #1d1f23;
    --muted: #686d75;
    --quiet: #9ba0a8;
    --hair: #dfe2dc;
    --indigo: #574ce3;
    --green: #4e8a35;
    --teal: #087b75;
    --amber: #a36f26;
    --danger: #b54545;
    --shadow: 0 8px 22px rgba(36, 39, 43, 0.08);
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --inspector-width: min(480px, 42vw);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    letter-spacing: 0;
  }

  button { font: inherit; letter-spacing: 0; }

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    clip-path: inset(var(--graph-clip-top, 0px) var(--graph-clip-right, 0px) var(--graph-clip-bottom, 0px) 0);
    touch-action: none;
    cursor: grab;
  }

  #viewport.dragging { cursor: grabbing; }

	#history-canvas {
		position: absolute;
		inset: 0;
		z-index: 0;
		display: block;
		width: 100%;
		height: 100%;
		pointer-events: none;
	}

  #world {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 100px;
		z-index: 1;
    transform-origin: 0 0;
  }

  #world.moving { will-change: transform; }

  #edge-layer {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
  }

  #window-frame {
    fill: rgba(255, 255, 255, 0.24);
    stroke: var(--indigo);
    stroke-width: 2;
    stroke-dasharray: 8 7;
    opacity: 0.72;
	transition: opacity 240ms ease;
  }

  #window-frame[hidden] { display: none; }

  body[data-mode="overview"] #window-frame { opacity: 0; }

  body[data-phase="compacting"] #window-frame {
    stroke: var(--green);
    stroke-dasharray: 4 5;
  }

  .edge {
    fill: none;
    stroke: #c7cbc4;
    stroke-width: 1.6;
    opacity: 0.68;
	transition: opacity 280ms ease, stroke 280ms ease;
  }

  .edge.pending { opacity: 0; }
	.edge.inactive { opacity: 0.12; }
	.edge.summary {
		stroke: var(--green);
		stroke-width: 1.8;
		stroke-dasharray: 5 5;
		opacity: 0.58;
	}
	.edge.summary.inactive { opacity: 0.2; }

	  .node {
	    position: absolute;
	    width: var(--node-width);
	    height: var(--node-height);
    border: 1.5px solid var(--node-color, var(--hair));
    border-radius: 8px;
    padding: 13px 14px 12px;
    background: rgba(255, 255, 255, 0.96);
    color: var(--ink);
    text-align: left;
    box-shadow: var(--shadow);
	    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    opacity: 0;
    transform-origin: center;
  }

  .node.moving { will-change: transform, opacity; }
	.node:active { cursor: grabbing; }

	  .node:hover {
    border-width: 2px;
    outline: none;
  }

  .node::before {
    content: "";
    position: absolute;
    top: 0;
    left: 13px;
    width: 28px;
    height: 3px;
    background: var(--node-color, var(--quiet));
  }

  .node-kind {
    display: block;
    color: var(--node-color, var(--quiet));
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
  }

	  .node-title {
	    display: block;
	    margin-top: 9px;
	    overflow: hidden;
	    color: var(--ink);
	    font-size: 16px;
	    font-weight: 700;
	    line-height: 1.18;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	  }

	  .node-detail {
	    display: block;
	    margin-top: 7px;
	    overflow: hidden;
	    color: var(--muted);
	    font-family: var(--mono);
	    font-size: 10px;
	    line-height: 1.35;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	  }

  .node.aggregate {
    border-style: dashed;
    background: rgba(247, 248, 246, 0.96);
    box-shadow: none;
  }

	.node.inactive {
		box-shadow: none;
		filter: grayscale(0.42) saturate(0.55);
	}

	.node.inactive::before { opacity: 0.48; }

	.node.pending-context {
		border-style: dashed;
		background: rgba(255, 255, 255, 0.82);
		box-shadow: 0 5px 16px rgba(36, 39, 43, 0.06);
		filter: none;
	}

	.node.pending-context::before { opacity: 0.82; }

	.node.active {
		box-shadow: 0 8px 22px rgba(36, 39, 43, 0.08), 0 0 0 3px rgba(87, 76, 227, 0.08);
	}

	.node.memory.active {
		box-shadow: 0 8px 22px rgba(36, 39, 43, 0.08), 0 0 0 3px rgba(78, 138, 53, 0.1);
	}

	.node.entered { animation: context-enter 620ms cubic-bezier(0.2, 0.75, 0.2, 1); }
	.node.exited { animation: context-exit 520ms ease-out; }

	@keyframes context-enter {
		0% { filter: brightness(1.18); }
		45% { filter: brightness(1.06); }
		100% { filter: none; }
	}

	@keyframes context-exit {
		0% { filter: grayscale(0) saturate(1); }
		100% { filter: grayscale(0.42) saturate(0.55); }
	}

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 22px;
    pointer-events: none;
  }

  #brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  #brand-name {
    font-size: 14px;
    font-weight: 760;
    line-height: 1;
  }

  #connection {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
  }

  #connection-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
  }

  #connection[data-state="live"] #connection-dot { background: var(--green); }
  #connection[data-state="offline"] #connection-dot { background: var(--danger); }

  #model {
    max-width: min(48vw, 480px);
    overflow: hidden;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.35;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #legend {
    position: fixed;
    top: 52px;
    left: 22px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    max-width: min(620px, calc(100vw - 44px));
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    pointer-events: none;
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-item i { width: 7px; height: 7px; border-radius: 50%; background: var(--legend-color); }

  #sessionbar {
    position: fixed;
    top: 76px;
    left: 22px;
    right: 22px;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    pointer-events: none;
  }

  #follow-active {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 7px;
    height: 30px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
  }

  #follow-active input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  #follow-track {
    position: relative;
    width: 28px;
    height: 16px;
    border: 1px solid #c9cdc6;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    transition: border-color 160ms ease, background 160ms ease;
  }

  #follow-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--quiet);
    transition: transform 160ms ease, background 160ms ease;
  }

  #follow-active input:checked + #follow-track {
    border-color: var(--indigo);
    background: rgba(87, 76, 227, 0.1);
  }

  #follow-active input:checked + #follow-track::after {
    background: var(--indigo);
    transform: translateX(12px);
  }

  #follow-active input:focus-visible + #follow-track { outline: 2px solid var(--indigo); outline-offset: 2px; }

  #session-tabs {
    display: flex;
    flex: 1 1 auto;
    gap: 6px;
    min-width: 0;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
    pointer-events: auto;
  }

  #session-tabs::-webkit-scrollbar { display: none; }

  .session-tab {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 7px;
    max-width: 220px;
    height: 30px;
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 0 10px;
    background: rgba(255, 255, 255, 0.86);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(36, 39, 43, 0.04);
  }

  .session-tab:hover { border-color: #c5c8c2; color: var(--ink); }
  .session-tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .session-tab[data-connected="false"] { opacity: 0.48; }

  .session-dot {
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--quiet);
  }

  .session-tab[data-active="true"] .session-dot { background: var(--green); }
  .session-tab[data-unread="true"] .session-dot { box-shadow: 0 0 0 3px rgba(87, 76, 227, 0.14); }
  .session-tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-tab-process { color: var(--quiet); font-size: 8px; }
  .session-tab[aria-selected="true"] .session-tab-process { color: rgba(255, 255, 255, 0.62); }

  #toolbar {
    position: fixed;
    right: 22px;
    bottom: 86px;
    z-index: 25;
    display: flex;
    align-items: center;
    padding: 3px;
    border: 1px solid var(--hair);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 3px 12px rgba(36, 39, 43, 0.07);
  }

  #toolbar button {
    min-width: 68px;
    height: 32px;
    border: 0;
    border-radius: 5px;
    padding: 0 11px;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
  }

  #toolbar button:hover { color: var(--indigo); }
  #toolbar button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #toolbar #fit-view { min-width: 44px; border-left: 1px solid var(--hair); border-radius: 0; }

  #empty-state {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 11px;
    pointer-events: none;
    transition: opacity 240ms ease;
  }

  #empty-state.hidden { opacity: 0; }

  #tooltip {
    position: fixed;
    z-index: 40;
    max-width: 250px;
    padding: 9px 11px;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease;
    white-space: pre-line;
  }

  #tooltip.visible { opacity: 0.96; }

  #detail-backdrop {
    position: fixed;
    inset: 0;
    z-index: 44;
    border: 0;
    padding: 0;
    background: rgba(29, 31, 35, 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }

  #detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    display: flex;
    width: min(480px, 100vw);
    border-left: 1px solid var(--hair);
    background: var(--surface);
    box-shadow: -12px 0 32px rgba(36, 39, 43, 0.12);
    flex-direction: column;
    transform: translateX(102%);
    transition: transform 220ms cubic-bezier(0.2, 0.75, 0.2, 1);
  }

  body[data-detail-open="true"] #detail-backdrop {
    opacity: 1;
    pointer-events: auto;
  }

  body[data-detail-open="true"] #detail-panel { transform: translateX(0); }

  #detail-header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--hair);
  }

  #detail-kind {
    color: var(--detail-color, var(--quiet));
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
  }

  #detail-title {
    margin: 7px 0 0;
    font-size: 22px;
    font-weight: 730;
    line-height: 1.2;
  }

  #detail-close {
    display: grid;
    width: 34px;
    height: 34px;
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    place-items: center;
  }

  #detail-close:hover { border-color: var(--ink); color: var(--ink); }
  #detail-close:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  #detail-close span { font-size: 22px; font-weight: 400; line-height: 1; }

  #detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-bottom: 1px solid var(--hair);
  }

  .detail-meta-cell {
    min-width: 0;
    padding: 13px 22px;
  }

  .detail-meta-cell + .detail-meta-cell { border-left: 1px solid var(--hair); }
  .detail-meta-cell span {
    display: block;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1;
    text-transform: uppercase;
  }

  .detail-meta-cell strong {
    display: block;
    margin-top: 6px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 650;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #detail-content {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 2px 22px 32px;
  }

  .detail-block {
    padding: 20px 0;
    border-bottom: 1px solid var(--hair);
  }

  .detail-block:last-child { border-bottom: 0; }
  .detail-block-label {
    display: block;
    margin-bottom: 10px;
    color: var(--detail-color, var(--quiet));
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .detail-block pre {
    margin: 0;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    tab-size: 2;
    white-space: pre-wrap;
    user-select: text;
  }

  .detail-block[data-type="thinking"] pre { color: var(--muted); }
  .detail-block img {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--hair);
    border-radius: 4px;
  }

  #detail-empty {
    margin: 0;
    padding: 24px 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.65;
  }

  #statusbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto auto;
    align-items: center;
    gap: 28px;
    min-height: 64px;
    padding: 12px 22px;
    border-top: 1px solid var(--hair);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
  }

  #usage-wrap { min-width: 0; }

  .status-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
  }

  #usage-value { color: var(--ink); }

  #usage-track {
    width: 100%;
    height: 4px;
    margin-top: 9px;
    overflow: hidden;
    background: #e5e7e2;
  }

  #usage-fill {
    width: 0;
    height: 100%;
    background: var(--indigo);
    transition: width 500ms cubic-bezier(0.2, 0.7, 0.2, 1), background 240ms ease;
  }

  #usage-fill[data-level="high"] { background: var(--amber); }
  #usage-fill[data-level="critical"] { background: var(--danger); }

  .stat {
    min-width: 82px;
    text-align: right;
  }

  .stat strong {
    display: block;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.1;
  }

  .stat span {
    display: block;
    margin-top: 5px;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    text-transform: uppercase;
  }

  @media (max-width: 720px) {
    #topbar { padding: 16px; }
    #legend { top: 48px; left: 16px; gap: 7px 10px; }
    #sessionbar { top: 72px; left: 16px; right: 16px; gap: 8px; }
    #follow-label { display: none; }
    .session-tab { max-width: 156px; padding: 0 9px; }
    .session-tab-process { display: none; }
    #model { max-width: 42vw; }
    #toolbar { right: 14px; bottom: 112px; }
    #toolbar button { min-width: 62px; padding: 0 8px; }
    #statusbar {
      grid-template-columns: 1fr auto;
      gap: 10px 16px;
      min-height: 92px;
      padding: 12px 16px;
    }
    #usage-wrap { grid-column: 1 / -1; }
    .stat { min-width: 0; text-align: left; }
    .stat:last-child { text-align: right; }
    #detail-panel { width: 100vw; }
    #detail-header { padding: 18px 18px 15px; }
    .detail-meta-cell { padding: 12px 18px; }
    #detail-content { padding: 2px 18px 28px; }
  }

  @media (max-height: 420px) and (orientation: landscape) {
    #topbar { padding: 10px 14px; }
    #legend { display: none; }
    #sessionbar { top: 44px; left: 14px; right: 202px; }
    #toolbar { top: 42px; right: 14px; bottom: auto; }
    #toolbar button { min-width: 56px; height: 30px; padding: 0 8px; }
    #toolbar #fit-view { min-width: 40px; }
    #statusbar {
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 16px;
      min-height: 56px;
      padding: 8px 14px;
    }
    #usage-wrap { grid-column: auto; }
    #usage-track { margin-top: 7px; }
    .stat { min-width: 72px; text-align: right; }
    .stat:last-child { text-align: right; }
    .stat span { margin-top: 3px; }
    .node { padding: 9px 10px; }
    .node::before { left: 10px; }
    .node-title { margin-top: 6px; font-size: 20px; }
    .node-detail { display: none; }
  }

  [hidden] { display: none !important; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .node:focus-visible {
    outline: 2px solid var(--indigo); outline-offset: 3px;
  }
  .node { padding: 12px; border-color: var(--hair); border-radius: 10px; }
  .node-title { font-size: 14px; margin-top: 7px; line-height: 1.35; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .node-detail { font-family: var(--sans); font-size: 11px; margin-top: 5px; }
  .node-kind { font-size: 9px; }
  .node.selected { outline: 2px solid var(--ink); outline-offset: 4px; }
  .node[data-synthetic="true"] { border-style: dashed; border-radius: 22px; box-shadow: none; }
  .node[data-error="true"]::before { background: var(--danger); }
  .node-badge { font-family: var(--mono); font-size: 8px; margin-left: 7px; color: var(--muted); }
  #workspacebar {
    position: fixed; top: 124px; left: 22px; right: 22px; z-index: 22;
    display: flex; align-items: center; gap: 12px; min-height: 38px;
  }
  #toolbar { position: static; display: flex; flex-shrink: 0; padding: 3px; box-shadow: none; }
  #toolbar button { font-size: 11px; min-height: 34px; }
  #search-box { margin-left: auto; position: relative; width: min(280px, 32vw); }
  #search-input { width: 100%; height: 40px; padding: 0 34px 0 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--surface); color: var(--ink); font: 12px var(--sans); }
  #search-clear { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  #search-results { position: absolute; top: 47px; right: 0; width: min(400px, calc(100vw - 32px)); max-height: min(420px, 55vh); overflow: auto; border: 1px solid var(--hair); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  #search-note { margin: 0; padding: 12px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--hair); }

<script>
"use strict";

/* Interaction model adapted from graph-deck by Yohei Nakajima. */

const EVENT_CAPABILITY_STORAGE_KEY = "context-rail-event-token";
const eventCapabilityToken = (() => {
	const storageKey = EVENT_CAPABILITY_STORAGE_KEY;
	const fragmentToken = new URLSearchParams(location.hash.slice(1)).get("token");
	if (fragmentToken !== null) {
		try {
			sessionStorage.setItem(storageKey, fragmentToken);
		} catch {
			// The current page can still use the fragment capability when storage is unavailable.
		}
		history.replaceState(history.state, "", `${location.pathname}${location.search}`);
		return fragmentToken;
	}
	try {
		return sessionStorage.getItem(storageKey);
	} catch {
		return null;
	}
})();

const $ = (selector) => document.querySelector(selector);
const viewport = $("#viewport");
const world = $("#world");
const edgeLayer = $("#edge-layer");
const edgeGroup = $("#edges");
const windowFrame = $("#window-frame");
const tooltip = $("#tooltip");
const detailBackdrop = $("#detail-backdrop");

const followToggle = $("#follow-toggle");
const toolbar = $("#toolbar");
const workspaceBar = $("#workspacebar");
const captureBar = $("#capturebar");
const statusBar = $("#statusbar");
const sceneEngine = globalThis.ContextRailCore;
const historyEngine = globalThis.ContextRailPixi;
const reducedMotionQuery = matchMedia("(prefers-reduced-motion: reduce)");
let reducedMotion = reducedMotionQuery.matches;
const MAX_STAGGER_TOTAL_MS = 280;
const MAX_STAGGER_STEP_MS = 44;
const MAX_ANIMATED_NODES = 120;
const MAX_FALLBACK_HISTORY_NODES = 360;
const FALLBACK_OVERSCAN_PX = 260;
const MIN_CAMERA_SCALE = 0.004;
const MAX_CAMERA_SCALE = 2.4;
const MIN_VISIBLE_SCENE_PIXELS = 48;
const WHEEL_ZOOM_SENSITIVITY = 0.0015;
const MOBILE_BREAKPOINT = 720;
const NODE_WIDTH_DESKTOP = 176;
const NODE_WIDTH_MOBILE = 164;
const NODE_HEIGHT = 92;
const NODE_HEIGHT_SHORT_LANDSCAPE = 64;
const POSITION_EPSILON = 0.08;
const OPACITY_EPSILON = 0.002;
const SCALE_EPSILON = 0.0002;

const kindMeta = {
  system: { label: "System", color: "#1d1f23", lane: -54 },
  memory: { label: "Memory", color: "#4e8a35", lane: 54 },
  developer: { label: "Developer", color: "#8b3f6f", lane: -42 },
  user: { label: "User", color: "#574ce3", lane: -25 },
  assistant: { label: "Assistant", color: "#087b75", lane: 28 },
  tool: { label: "Tool", color: "#a36f26", lane: 68 },
  unknown: { label: "Context", color: "#7b8087", lane: 0 },
};

const nodes = new Map();
const edges = new Map();
const movingNodes = new Set();
const dirtyEdges = new Set();
const sessionStates = new Map();
const deltaTransfers = new Map();
const sessionViews = new Map();
const sessionLayouts = new Map();
const unreadSessions = new Set();
let sessionSummaries = [];
let selectedStreamId = null;
let activeStreamId = null;
let followActive = false;
let currentPayload = null;
let viewMode = "window";
let freeCamera = false;
let lastAnimatedRevision = -1;
let hoveredNode = null;
let detailSelection = null;
let livePayload = null;
let frozenCapture = null;
let detailDisplayedItem = null;
let detailOverride = null;
let detailMode = "read";
let detailReturnFocus = null;
let detailBefore = null;
let detailCompareKey = null;
let lastHistoryReference = null;
let lastIndexedTimeline = null;
let historyById = new Map();
let currentActiveIds = new Set();
let currentPendingIds = new Set();
let currentSummarySources = new Map();
let detailOrder = [];
let detailOrderPositions = new Map();
const contentIndex = new sceneEngine.ContentIndex();
const BACKGROUND_ITEM_THRESHOLD = 750;
const layoutWorker = new sceneEngine.LayoutWorkerClient();
let sceneJobGeneration = 0;
let pendingScene = null;
let preparedLayout = null;
let indexAbort = null;
let indexGeneration = 0;
let indexBusy = false;
let workerFallback = false;
let searchGeneration = 0;
let searchTimer = null;
let lastSearchRevision = -1;
let lastCaptureOptionsKey = null;
let lastCaptureArchive = null;
let captureChanges = null;
const viewStats = { reconciliations: 0, inspectorRenders: 0, searchMs: 0, reconcileMs: 0, maxReconcileMs: 0 };
let camera = { x: 500, y: 420, scale: 0.8 };
let cameraTarget = { x: 500, y: 420, scale: 0.8 };
let frameBox = { x: 180, y: 220, width: 640, height: 360 };
let frameTarget = { ...frameBox };
let fitTarget = { ...frameBox };
let graphViewportBounds = null;
let cameraDirty = true;
let frameDirty = true;
let animationFrameId = null;
let animationFrameUsesTimeout = false;
let renderLoopActive = false;
let currentSceneLayout = null;
let cameraContentBounds = [];
let activeCameraContentBounds = [];
let viewedEpochIndex = null;
let restoredSceneEpoch = null;
let historyRenderer = null;
let historyRendererAvailable = false;
let historyRendererState = historyEngine ? "initializing" : "fallback";
let historyRendererError = historyEngine ? null : "Pixi bundle unavailable";
let fallbackRefreshTimer = null;
let lastFallbackRefreshAt = 0;
let historyRendererReconcileScheduled = false;
let lastReconciledTimeline = null;
let lastReconciledMode = null;
let lastReconciledRendererState = null;
let lastReconciledDimensions = null;
const historyHandoffIds = new Set();
const renderStats = {
  frames: 0,
  totalNodeUpdates: 0,
  totalEdgeUpdates: 0,
  lastFrameNodeUpdates: 0,
  lastFrameEdgeUpdates: 0,
  peakFrameNodeUpdates: 0,
  peakFrameEdgeUpdates: 0,
  lastFrameAt: null,
  sleepingSince: null,
};

function syncHistoryRendererDataset() {
	document.body.dataset.renderer = historyRendererAvailable ? "pixi" : "dom";
	if (historyRendererError) document.body.dataset.rendererError = historyRendererError;
	else delete document.body.dataset.rendererError;
}

function scheduleHistoryRendererReconcile() {
	if (historyRendererReconcileScheduled || !currentPayload) return;
	historyRendererReconcileScheduled = true;
	queueMicrotask(() => {
		historyRendererReconcileScheduled = false;
		if (currentPayload) applyPayload(currentPayload, false, true);
	});
}

function enterHistoryRendererFallback(error, destroy = false) {
	const failedRenderer = historyRenderer;
	historyRendererAvailable = false;
	historyRendererState = "fallback";
	historyRendererError = error instanceof Error ? error.message : String(error);
	historyHandoffIds.clear();
	if (destroy) {
		historyRenderer = null;
		try { failedRenderer?.destroy(); } catch (_) {}
	}
	syncHistoryRendererDataset();
	scheduleHistoryRendererReconcile();
}

function activateHistoryRenderer() {
	if (!historyRenderer) return;
	historyRendererAvailable = true;
	historyRendererState = "pixi";
	historyRendererError = null;
	syncHistoryRendererDataset();
	scheduleHistoryRendererReconcile();
	markCameraDirty();
}

function useHistoryRenderer(operation) {
	if (!historyRendererAvailable || !historyRenderer) return false;
	try {
		operation(historyRenderer);
		return true;
	} catch (error) {
		enterHistoryRendererFallback(error, true);
		return false;
	}
}

function readHistoryRenderer(operation, fallback = null) {
	if (!historyRendererAvailable || !historyRenderer) return fallback;
	try {
		return operation(historyRenderer);
	} catch (error) {
		enterHistoryRendererFallback(error, true);
		return fallback;
	}
}

if (historyEngine?.createHistoryRenderer) {
	historyEngine.createHistoryRenderer(viewport, {
		onContextLost() {
			enterHistoryRendererFallback("WebGL context lost");
		},
		onContextRestored() {
			activateHistoryRenderer();
		},
		onError(error) {
			enterHistoryRendererFallback(error, true);
		},
	}).then((renderer) => {
		historyRenderer = renderer;
		try {
			if (renderer.diagnostics().contextLost) enterHistoryRendererFallback("WebGL context lost");
			else activateHistoryRenderer();
		} catch (error) {
			enterHistoryRendererFallback(error, true);
		}
	}).catch((error) => {
		enterHistoryRendererFallback(error, true);
	});
} else {
	syncHistoryRendererDataset();
}

function differs(left, right, epsilon) {
  return Math.abs(left - right) > epsilon;
}

function approach(current, target, ease, epsilon) {
  if (!differs(current, target, epsilon)) return target;
  const next = current + (target - current) * ease;
  return differs(next, target, epsilon) ? next : target;
}

function scheduleRender() {
  if (animationFrameId !== null) return;
  renderLoopActive = true;
  document.body.dataset.renderLoop = "active";
  renderStats.sleepingSince = null;
  animationFrameUsesTimeout = document.hidden;
  animationFrameId = animationFrameUsesTimeout
    ? setTimeout(() => renderFrame(performance.now()), 0)
    : requestAnimationFrame(renderFrame);
}

function markNodeMoving(node) {
  movingNodes.add(node);
  node.element.classList.add("moving");
	scheduleRender();
}

function markCameraDirty() {
  cameraDirty = true;
  world.classList.add("moving");
	scheduleRender();
}

function markFrameDirty() {
  frameDirty = true;
  scheduleRender();
}

function isMobileLayout() {
	return innerWidth <= MOBILE_BREAKPOINT;
}

function graphWidth() {
	return document.body.dataset.detailOpen === "true" && !isMobileLayout()
		? Math.max(1, innerWidth - detailPanel.getBoundingClientRect().width)
		: innerWidth;
}

function focusGridColumns(viewportWidth) {
	if (viewportWidth <= 720) return 2;
	if (viewportWidth <= 960) return 3;
	if (viewportWidth <= 1120) return 4;
	if (viewportWidth <= 1280) return 5;
	return 6;
}

function isShortLandscapeViewport(viewportWidth, viewportHeight) {
	return viewportHeight <= 420 && viewportWidth > viewportHeight;
}

function isShortLandscapeLayout() {
	return isShortLandscapeViewport(innerWidth, innerHeight);
}

function availableGraphViewport(viewportHeight, sessionBottom, toolbarTop, statusTop) {
	const heightLimit = Math.max(1, viewportHeight);
	const top = Math.min(heightLimit, Math.max(0, sessionBottom));
	const bottom = Math.max(top, Math.min(heightLimit, toolbarTop, statusTop));
	return {
		top,
		bottom,
		height: Math.max(1, bottom - top),
		centerY: top + (bottom - top) / 2,
	};
}

function syncGraphViewport() {
		document.documentElement.style.setProperty("--search-results-top", `${workspaceBar.getBoundingClientRect().bottom + 8}px`);
		const bounds = availableGraphViewport(
			innerHeight,
			workspaceBar.getBoundingClientRect().bottom + ($("#work-status").hidden ? 18 : 38),
			captureBar.getBoundingClientRect().top - 18,
			statusBar.getBoundingClientRect().top,
		);
		const topInset = `${bounds.top}px`;
		const bottomInset = `${Math.max(0, innerHeight - bounds.bottom)}px`;
		bounds.width = graphWidth();
		bounds.centerX = bounds.width / 2;
		const boundsChanged = !graphViewportBounds
			|| differs(graphViewportBounds.top, bounds.top, POSITION_EPSILON)
			|| differs(graphViewportBounds.bottom, bounds.bottom, POSITION_EPSILON)
			|| differs(graphViewportBounds.width, bounds.width, POSITION_EPSILON);
		const clipChanged = viewport.style.getPropertyValue("--graph-clip-top") !== topInset
			|| viewport.style.getPropertyValue("--graph-clip-bottom") !== bottomInset;
		if (clipChanged) {
			viewport.style.setProperty("--graph-clip-top", topInset);
			viewport.style.setProperty("--graph-clip-bottom", bottomInset);
		}
		viewport.style.setProperty("--graph-clip-right", `${innerWidth - bounds.width}px`);
		graphViewportBounds = bounds;
		return boundsChanged || clipChanged;
}

function graphViewport() {
		if (!graphViewportBounds) syncGraphViewport();
		return graphViewportBounds;
}

const graphChromeResizeObserver = typeof ResizeObserver === "function"
	? new ResizeObserver(() => {
		if (!syncGraphViewport()) return;
		if (freeCamera) {
			camera = constrainCamera(camera, true);
			cameraTarget = constrainCamera(cameraTarget, true);
		} else fitView(false);
		markCameraDirty();
	})
	: null;
for (const element of [sessionBar, workspaceBar, captureBar, statusBar]) graphChromeResizeObserver?.observe(element);
syncGraphViewport();

function handleReducedMotionChange(event) {
	reducedMotion = event.matches;
	if (!reducedMotion) return;
	for (const node of nodes.values()) {
		node.pendingDiff = null;
		node.element.classList.remove("entered", "exited");
		markNodeMoving(node);
	}
	markCameraDirty();
	markFrameDirty();
}

reducedMotionQuery.addEventListener("change", handleReducedMotionChange);

function formatTokens(value) {
  if (!Number.isFinite(value)) return "?";
  if (value >= 1000000) return `${(value / 1000000).toFixed(1)}m`;
  if (value >= 1000) return `${(value / 1000).toFixed(1)}k`;
  return String(Math.round(value));
}

function setConnection(state, label) {
  const connection = $("#connection");
  connection.dataset.state = state;
  $("#connection-label").textContent = label;
}

function itemKey(item) {
  return String(item.id);
}

function timelineFrom(payload) {
  if (payload.timeline && Array.isArray(payload.timeline.history)) return payload.timeline;
  const items = payload.snapshot && Array.isArray(payload.snapshot.items) ? payload.snapshot.items : [];
  return {
    revision: payload.sequence || 0,
    history: items.map((item, order) => ({ ...item, order })),
    activeIds: items.map(itemKey),
    enteredIds: items.map(itemKey),
    retainedIds: [],
    exitedIds: [],
    observedIds: [],
    confirmedIds: [],
    pendingIds: [],
    summaryEdges: [],
  };
}

function clearGraph() {
  cancelBackgroundWork();
  hideTooltip();
  closeDetail();
	windowFrame.toggleAttribute("hidden", true);
	if (fallbackRefreshTimer !== null) clearTimeout(fallbackRefreshTimer);
	fallbackRefreshTimer = null;
	lastFallbackRefreshAt = 0;
  for (const node of nodes.values()) {
    if (node.removeTimer) clearTimeout(node.removeTimer);
    node.element.remove();
  }
  nodes.clear();
  movingNodes.clear();
  for (const edge of edges.values()) edge.path.remove();
  edges.clear();
	dirtyEdges.clear();
	currentSceneLayout = null;
	cameraContentBounds = [];
	activeCameraContentBounds = [];
	viewedEpochIndex = null;
	restoredSceneEpoch = null;
	historyHandoffIds.clear();
	useHistoryRenderer((renderer) => renderer.setScene({ nodes: [], edges: [] }));
  lastAnimatedRevision = -1;
	lastReconciledTimeline = null;
	lastReconciledMode = null;
	lastReconciledRendererState = null;
	lastReconciledDimensions = null;
	lastHistoryReference = null;
	lastIndexedTimeline = null;

function syncModeChrome() {
  document.body.dataset.mode = viewMode;
  $("#window-mode").setAttribute("aria-pressed", String(viewMode === "window"));
  $("#overview-mode").setAttribute("aria-pressed", String(viewMode === "overview"));
}

function saveSessionView() {
	  if (!selectedStreamId || !sessionStates.has(selectedStreamId)) return;
  sessionViews.set(selectedStreamId, {
    mode: viewMode,
    freeCamera,
	viewedEpochIndex,
	sceneEpoch: currentSceneLayout?.currentEpoch ?? null,

  });
}

function restoreSessionView(streamId) {
  const saved = sessionViews.get(streamId);
  viewMode = saved ? saved.mode : "window";
  freeCamera = saved ? saved.freeCamera : false;
  viewedEpochIndex = saved?.viewedEpochIndex ?? null;
	restoredSceneEpoch = saved?.sceneEpoch ?? null;
  camera = saved ? { ...saved.camera } : { x: 500, y: 420, scale: 0.8 };
  cameraTarget = saved ? { ...saved.cameraTarget } : { ...camera };

function setFollowActive(next) {
  followActive = Boolean(next);
  followToggle.checked = followActive;
  if (followActive && activeStreamId && sessionStates.has(activeStreamId)) {
    selectSession(activeStreamId);
  }
  renderSessionTabs();
}

function selectSession(streamId, manual = false) {
  if (!streamId || !sessionStates.has(streamId)) return;
  if (manual) {
    followActive = false;
    followToggle.checked = false;
  }
  unreadSessions.delete(streamId);
  if (selectedStreamId === streamId) {
    renderSessionTabs();
    return;
  }
	  if (selectedStreamId && sessionStates.has(selectedStreamId)) saveSessionView();
  clearGraph();
  frozenCapture = null;
  livePayload = null;
  lastCaptureOptionsKey = null;
  selectedStreamId = streamId;
  restoreSessionView(streamId);
  currentPayload = null;
  applyPayload(sessionStates.get(streamId), false);
  renderSessionTabs();
}

function renderSessionTabs() {
  const existing = new Map([...sessionTabs.children].map((tab) => [tab.dataset.streamId, tab]));
  const wanted = new Set();
  const keyboardStreamId = sessionSummaries.some((summary) => summary.streamId === selectedStreamId)
    ? selectedStreamId
    : sessionSummaries[0]?.streamId;
  for (const summary of sessionSummaries) {
    wanted.add(summary.streamId);
    let tab = existing.get(summary.streamId);
    if (!tab) {
      tab = document.createElement("button");
      tab.type = "button";
      tab.className = "session-tab";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", "viewport");
      tab.dataset.streamId = summary.streamId;
      const dot = document.createElement("i");
      dot.className = "session-dot";
      dot.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "session-tab-label";
      const process = document.createElement("span");
      process.className = "session-tab-process";
      tab.append(dot, label, process);
      tab.addEventListener("click", () => selectSession(tab.dataset.streamId, true));
    }
    tab.querySelector(".session-tab-label").textContent = summary.sessionLabel;
    tab.querySelector(".session-tab-process").textContent = summary.processLabel;
    tab.dataset.active = String(Boolean(summary.active));
    tab.dataset.connected = String(Boolean(summary.connected));
    tab.dataset.unread = String(unreadSessions.has(summary.streamId));
    tab.setAttribute("aria-selected", String(summary.streamId === selectedStreamId));
    tab.id = `session-tab-${encodeURIComponent(summary.streamId)}`;
    tab.tabIndex = summary.streamId === keyboardStreamId ? 0 : -1;
    tab.title = `${summary.sessionLabel} - ${summary.processLabel}${summary.active ? " - active in OMP" : ""}${summary.connected ? "" : " - process offline"}`;
    sessionTabs.appendChild(tab);
  }
  for (const [streamId, tab] of existing) {
    if (!wanted.has(streamId)) tab.remove();
  }
  const labelledTab = [...sessionTabs.children]
    .find((tab) => tab.dataset.streamId === (selectedStreamId || keyboardStreamId));
  if (labelledTab) viewport.setAttribute("aria-labelledby", labelledTab.id);
  else viewport.removeAttribute("aria-labelledby");
}

function emptyTimeline() {
  return {
    revision: 0,
    history: [],
    activeIds: [],
    enteredIds: [],
    retainedIds: [],
    exitedIds: [],
    observedIds: [],
    confirmedIds: [],
    pendingIds: [],
    summaryEdges: [],
  };
}

function summaryEdgeKey(edge) {
  return JSON.stringify([edge.kind, edge.from, edge.to]);
}

function applyRenderStatePatch(previous, patch) {
  const state = patch.reset || !previous
    ? { phase: "idle", activeTools: [], timeline: emptyTimeline() }
	    : { ...previous };

  if (Object.hasOwn(patch, "snapshot")) state.snapshot = patch.snapshot || undefined;
  if (patch.phase) state.phase = patch.phase;
  if (Array.isArray(patch.activeTools)) state.activeTools = [...patch.activeTools];
  if (Object.hasOwn(patch, "captures")) {
    state.captures = sceneEngine.applyCaptureArchivePatch(state.captures, patch.captures);
    if (!state.captures) delete state.captures;
  }
  if (patch.timeline === null) {
    delete state.timeline;
    return state;
  }
  if (!patch.timeline) return state;

  const timeline = patch.timeline.reset || !state.timeline
    ? emptyTimeline()
	    : { ...state.timeline };
	  const historyUpserts = patch.timeline.historyUpserts || [];
	  if (historyUpserts.length > 0 || patch.timeline.removedHistoryIds?.length) {
	    const history = new Map(timeline.history.map((item) => [item.id, item]));
	    for (const id of patch.timeline.removedHistoryIds || []) history.delete(id);
	    for (const item of historyUpserts) history.set(item.id, structuredClone(item));
	    timeline.history = [...history.values()].sort((left, right) => left.order - right.order);
	  }

	  const summaryEdgeUpserts = patch.timeline.summaryEdgeUpserts || [];
	  if (summaryEdgeUpserts.length > 0 || patch.timeline.removedSummaryEdges?.length) {
	    const summaryEdges = new Map(timeline.summaryEdges.map((edge) => [summaryEdgeKey(edge), edge]));
	    for (const edge of patch.timeline.removedSummaryEdges || []) summaryEdges.delete(summaryEdgeKey(edge));
	    for (const edge of summaryEdgeUpserts) {
	      summaryEdges.set(summaryEdgeKey(edge), structuredClone(edge));
	    }
	    timeline.summaryEdges = [...summaryEdges.values()];
	  }
  if (Number.isFinite(patch.timeline.revision)) timeline.revision = patch.timeline.revision;
  if (Object.hasOwn(patch.timeline, "retention")) {
    if (patch.timeline.retention === null) delete timeline.retention;
    else timeline.retention = { ...patch.timeline.retention };
  }
  for (const key of [
    "activeIds",
    "enteredIds",
    "retainedIds",
    "exitedIds",
    "observedIds",
    "confirmedIds",
    "pendingIds",
  ]) {
    if (Array.isArray(patch.timeline[key])) timeline[key] = [...patch.timeline[key]];
  }
  state.timeline = timeline;
  return state;
}

function decodeDeltaChunks(chunks) {
  const decoded = chunks.map(({ data }) => {
    const binary = atob(data);
    return Uint8Array.from(binary, (character) => character.charCodeAt(0));
  });
  const byteLength = decoded.reduce((total, chunk) => total + chunk.byteLength, 0);
  const bytes = new Uint8Array(byteLength);
  let offset = 0;
  for (const chunk of decoded) {
    bytes.set(chunk, offset);
    offset += chunk.byteLength;
  }
  const patch = JSON.parse(new TextDecoder().decode(bytes));
  if (!patch || typeof patch !== "object" || Array.isArray(patch)) {
    throw new Error("Invalid render state patch");
  }
  return patch;
}

function applyDelta(delta) {
  if (
    !delta
    || typeof delta.streamId !== "string"
    || typeof delta.transferId !== "string"
    || !Number.isSafeInteger(delta.index)
    || delta.index < 0
    || typeof delta.data !== "string"
    || typeof delta.complete !== "boolean"
  ) throw new Error("Invalid delta event");

  let transfer = deltaTransfers.get(delta.streamId);
  if (delta.index === 0) {
    transfer = { transferId: delta.transferId, chunks: [] };
    deltaTransfers.set(delta.streamId, transfer);
  } else if (
    !transfer
    || transfer.transferId !== delta.transferId
    || transfer.chunks.length !== delta.index
  ) {
    deltaTransfers.delete(delta.streamId);
    throw new Error("Delta events arrived out of order");
  }
  transfer.chunks.push({ data: delta.data });
  if (!delta.complete) return null;

  deltaTransfers.delete(delta.streamId);
  const patch = decodeDeltaChunks(transfer.chunks);
  const state = applyRenderStatePatch(sessionStates.get(delta.streamId), patch);
  sessionStates.set(delta.streamId, state);
  return { streamId: delta.streamId, state };
}

function shouldMarkUnread(payload, changed, selectedId) {
  return Boolean(changed && payload.activity !== false && changed.streamId !== selectedId);
}

function applyHubPayload(payload) {
	const focusedStreamId = document.activeElement?.classList?.contains("session-tab")
		? document.activeElement.dataset.streamId
		: null;
	const knownStreamIds = new Set([
			...sessionStates.keys(),
			...sessionViews.keys(),
			...sessionLayouts.keys(),
		...unreadSessions,
		...deltaTransfers.keys(),
	]);
	if (payload.type === "bootstrap") {
		deltaTransfers.clear();
		sessionStates.clear();
	}
	const updatedStateIds = new Set();
	if (Array.isArray(payload.states)) {
		for (const entry of payload.states) {
			sessionStates.set(entry.streamId, entry.state);
			updatedStateIds.add(entry.streamId);
		}
	}
  if (payload.changed) deltaTransfers.delete(payload.changed.streamId);
  const changed = payload.delta ? applyDelta(payload.delta) : payload.changed;
	  if (changed) {
			sessionStates.set(changed.streamId, changed.state);
			if (shouldMarkUnread(payload, changed, selectedStreamId)) unreadSessions.add(changed.streamId);
	  }
	let available = new Set(sessionSummaries.map((summary) => summary.streamId));
	if (Array.isArray(payload.sessions)) {
		sessionSummaries = payload.sessions;
		available = new Set(sessionSummaries.map((summary) => summary.streamId));
		for (const streamId of sessionStates.keys()) knownStreamIds.add(streamId);
		for (const streamId of knownStreamIds) {
			if (available.has(streamId)) continue;
				sessionStates.delete(streamId);
				sessionViews.delete(streamId);
				sessionLayouts.delete(streamId);
				layoutWorker.forget(`${streamId}|`);
			unreadSessions.delete(streamId);
			deltaTransfers.delete(streamId);
		}
	}
	activeStreamId = payload.activeStreamId || null;
	if (detailSelection && !sessionStates.has(detailSelection.streamId)) closeDetail();

  let target = available.has(selectedStreamId) ? selectedStreamId : null;
  if (followActive) {
    target = activeStreamId && sessionStates.has(activeStreamId)
      ? activeStreamId
      : sessionSummaries.find((summary) => summary.active && sessionStates.has(summary.streamId))?.streamId || target;
  }
  target ||= sessionSummaries.find((summary) => sessionStates.has(summary.streamId))?.streamId || null;

	renderSessionTabs();
	if (target && target !== selectedStreamId) selectSession(target);
	else if (changed && changed.streamId === selectedStreamId) applyPayload(changed.state, true);
	else if (target && updatedStateIds.has(target)) applyPayload(sessionStates.get(target), false);
	else if (!target && selectedStreamId) {
		clearGraph();
		selectedStreamId = null;
		currentPayload = null;
		livePayload = null;
		frozenCapture = null;
		lastCaptureOptionsKey = null;
		syncCaptureControls();
		updateChrome({ snapshot: null, phase: "idle", activeTools: [], timeline: timelineFrom({}) });
		$("#empty-state").textContent = "waiting for context";
		$("#empty-state").setAttribute("aria-hidden", "false");
		$("#empty-state").classList.remove("hidden");
	}

	if (focusedStreamId && !available.has(focusedStreamId)) {
		const replacement = [...sessionTabs.children]
			.find((tab) => tab.dataset.streamId === selectedStreamId);
		(replacement || followToggle).focus();
	}
}

function nodeText(item, index) {
  const meta = kindMeta[item.kind] || kindMeta.unknown;
  const content = sceneEngine.projectContent(item);
  const state = detailState(item);
	const excerpt = content.preview.startsWith(content.title) ? content.preview.slice(content.title.length).trim() : content.preview;
  return {
    kind: item.synthetic ? "Event" : meta.label,
    title: content.title,
    detail: excerpt || state,
    badge: content.messageCount > 1 ? `${content.messageCount} msgs` : content.imageCount ? `${content.imageCount} img` : "",
    state,
  };
}

function nodeDimensions() {
		  const dimensions = {
			  width: isMobileLayout() ? NODE_WIDTH_MOBILE : NODE_WIDTH_DESKTOP,
			  height: isShortLandscapeLayout() ? NODE_HEIGHT_SHORT_LANDSCAPE : NODE_HEIGHT,
		  };
		document.documentElement.style.setProperty("--node-width", `${dimensions.width}px`);
		document.documentElement.style.setProperty("--node-height", `${dimensions.height}px`);
		return dimensions;
}

function createNode(item, index, target, dimensions, revealAt = 0, start = null) {
	  const element = document.createElement("div");
	  element.className = "node";
	  element.setAttribute("role", "button");

  const kind = document.createElement("span");
  kind.className = "node-kind";
  const title = document.createElement("span");
  title.className = "node-title";
  const detail = document.createElement("span");
  detail.className = "node-detail";
	  element.append(kind, title, detail);

  const revealed = revealAt === 0;
	element.tabIndex = revealed ? 0 : -1;
  const node = {
    key: itemKey(item), item, index, element, kind, title, detail,
    x: start?.x ?? target.x + (viewMode === "window" ? 180 : 0),
    y: start?.y ?? target.y + 20,
    targetX: target.x,
    targetY: target.y,
    homeX: target.homeX,
    homeY: target.homeY,
    focusX: target.focusX,
    focusY: target.focusY,
	    width: dimensions.width,
	    height: dimensions.height,
    opacity: start?.opacity ?? 0,
    targetOpacity: revealed ? 1 : 0,
    revealOpacity: 1,
    revealAt,
    revealed,
    pendingDiff: null,
    dragX: 0,
    dragY: 0,
    dragging: false,
    edgeKeys: new Set(),
    removeTimer: null,
		handoffToHistory: false,
  };

  if (!revealed) {
    element.classList.add("queued");
    element.setAttribute("aria-hidden", "true");
  }

  attachNodeInteraction(node);
  updateNodeContent(node, item, index);
  return node;
}

function updateNodeContent(node, item, index) {
	  const meta = kindMeta[item.kind] || kindMeta.unknown;
	  const text = nodeText(item, index);
	  const active = Boolean(item.active);
	  const pending = Boolean(item.pending);
	  const memory = item.kind === "memory";
	  node.item = item;
	  node.index = index;
	  if (
	    node.content
	    && node.content.color === meta.color
	    && node.content.kind === text.kind
	    && node.content.title === text.title
	    && node.content.detail === text.detail
	    && node.content.active === active
	    && node.content.pending === pending
	    && node.content.memory === memory
	    && node.content.badge === text.badge
	    && node.content.synthetic === Boolean(item.synthetic)
	    && node.content.isError === Boolean(item.detail?.isError)
	  ) return;
	  node.content = { color: meta.color, kind: text.kind, title: text.title, detail: text.detail, active, pending, memory, badge: text.badge, synthetic: Boolean(item.synthetic), isError: Boolean(item.detail?.isError) };
	  node.element.style.setProperty("--node-color", meta.color);
		node.element.classList.toggle("active", active);
		node.element.classList.toggle("inactive", !active && !pending);
		node.element.classList.toggle("pending-context", pending);
		node.element.classList.toggle("memory", memory);
	node.element.dataset.itemId = node.key;
	node.element.dataset.contextState = item.pending ? "pending" : item.active ? "active" : "history";
  node.element.dataset.synthetic = String(Boolean(item.synthetic));
  node.element.dataset.error = String(Boolean(item.detail?.isError));
  node.element.classList.toggle("selected", detailSelection?.itemId === item.id);
  node.element.setAttribute("aria-label", `${text.kind}: ${text.title}. ${text.state}`);
  node.element.setAttribute("aria-pressed", String(detailSelection?.itemId === item.id));
  node.kind.textContent = text.kind + (text.badge ? ` · ${text.badge}` : "");
  node.title.textContent = text.title;
  node.detail.textContent = text.detail;
}

function buildLayout(timeline, dimensions) {
		if (!sceneEngine?.buildSceneLayout) throw new Error("ContextRail scene layout is unavailable");
		const focusColumns = focusGridColumns(graphWidth());
		const dimensionsKey = `${dimensions.width}:${dimensions.height}:${focusColumns}:${isShortLandscapeLayout()}:${isMobileLayout()}`;
		if (preparedLayout && sceneEngine.sameSceneTimeline(preparedLayout.timeline, timeline) && preparedLayout.dimensionsKey === dimensionsKey) {
			const layout = preparedLayout.layout;
			if (selectedStreamId) sessionLayouts.set(selectedStreamId, { timeline, dimensionsKey, layout });
			return layout;
		}
		const cached = selectedStreamId ? sessionLayouts.get(selectedStreamId) : null;
		if (cached?.timeline === timeline && cached.dimensionsKey === dimensionsKey) return cached.layout;
		const layout = sceneEngine.buildSceneLayout(timeline, {
			nodeWidth: dimensions.width,
			nodeHeight: dimensions.height,
			compact: isShortLandscapeLayout(),
			mobile: isMobileLayout(),
			focusColumns,
		}, cached?.layout);
		if (selectedStreamId) sessionLayouts.set(selectedStreamId, { timeline, dimensionsKey, layout });
		return layout;
	}

function nodeLayout(placement, active, pending) {
	const target = viewMode === "window"
		? active
			? placement.focus
			: pending
				? placement.pending
				: placement.historyFocus
		: placement.home;
	return {
		x: target.x,
		y: target.y,
		homeX: placement.home.x,
		homeY: placement.home.y,
		focusX: placement.focus.x,
		focusY: placement.focus.y,
		pendingX: placement.pending.x,
		pendingY: placement.pending.y,
	};
}

function rebuildCameraContentBounds(layout, activeIds, pendingIds, dimensions) {
	const prioritized = [[], [], []];
	for (const placement of layout.placements.values()) {
		const active = activeIds.has(placement.id);
		const pending = pendingIds.has(placement.id);
		const point = viewMode === "overview"
			? placement.home
			: active
				? placement.focus
				: pending
					? placement.pending
					: placement.historyFocus;
		prioritized[active ? 0 : pending ? 1 : 2].push({
			x: point.x - dimensions.width / 2,
			y: point.y - dimensions.height / 2,
			width: dimensions.width,
			height: dimensions.height,
		});
	}
	cameraContentBounds = prioritized.flat();
	const focusContentBounds = [...prioritized[0], ...prioritized[1]];
	activeCameraContentBounds = focusContentBounds.length ? focusContentBounds : cameraContentBounds;
}

function historyVisualOpacity() {
	return viewMode === "overview" ? 0.54 : 0.44;
}

function fallbackDomIds(items, activeIds, pendingIds) {
	const wanted = new Set([...activeIds, ...pendingIds]);
	if (!currentSceneLayout) return wanted;
	const viewportBounds = graphViewport();
	const scale = Math.max(camera.scale, MIN_CAMERA_SCALE);
	const halfWidth = (graphWidth() / 2 + FALLBACK_OVERSCAN_PX) / scale;
	const halfHeight = (viewportBounds.height / 2 + FALLBACK_OVERSCAN_PX) / scale;
	const visibleBounds = {
		left: camera.x - halfWidth,
		right: camera.x + halfWidth,
		top: camera.y - halfHeight,
		bottom: camera.y + halfHeight,
	};
	const dimensions = nodeDimensions();
	const candidates = [];
	for (const item of items) {
		const key = itemKey(item);
		if (wanted.has(key)) continue;
		const placement = currentSceneLayout.placements.get(key);
		if (!placement) continue;
		const point = viewMode === "overview" ? placement.home : placement.historyFocus;
		if (
			point.x + dimensions.width / 2 < visibleBounds.left
			|| point.x - dimensions.width / 2 > visibleBounds.right
			|| point.y + dimensions.height / 2 < visibleBounds.top
			|| point.y - dimensions.height / 2 > visibleBounds.bottom
		) continue;
		candidates.push({
			key,
			distance: Math.hypot(point.x - camera.x, point.y - camera.y),
		});
	}
	if (candidates.length <= MAX_FALLBACK_HISTORY_NODES) {
		for (const { key } of candidates) wanted.add(key);
		return wanted;
	}
	if (camera.scale < 0.16) {
		for (let index = 0; index < MAX_FALLBACK_HISTORY_NODES; index += 1) {
			const sampled = Math.floor(index * (candidates.length - 1) / (MAX_FALLBACK_HISTORY_NODES - 1));
			wanted.add(candidates[sampled].key);
		}
	} else {
		candidates.sort((left, right) => left.distance - right.distance);
		for (const { key } of candidates.slice(0, MAX_FALLBACK_HISTORY_NODES)) wanted.add(key);
	}
	return wanted;
}

function scheduleFallbackRefresh() {
	if (historyRendererState === "pixi" || !currentPayload) return;
	const refresh = () => {
		fallbackRefreshTimer = null;
		if (historyRendererState === "pixi" || !currentPayload) return;
		lastFallbackRefreshAt = performance.now();
		reconcileNodes(timelineFrom(currentPayload), false);
	};
	const remaining = 80 - (performance.now() - lastFallbackRefreshAt);
	if (remaining <= 0) {
		if (fallbackRefreshTimer !== null) clearTimeout(fallbackRefreshTimer);
		refresh();
		return;
	}
	if (fallbackRefreshTimer === null) fallbackRefreshTimer = setTimeout(refresh, remaining);
}

function flashDiff(node, diff) {
	  if (!diff || reducedMotion) return;
  node.element.classList.remove("entered", "exited");
  void node.element.offsetWidth;
  node.element.classList.add(diff);
	  setTimeout(() => node.element.classList.remove(diff), 680);
}

function revealNode(node) {
  node.revealed = true;
  node.revealAt = 0;
  node.targetOpacity = node.revealOpacity;
  node.element.classList.remove("queued");
  node.element.dataset.revealed = "true";
  if (node.element.dataset.revealOrder !== undefined) {
    node.element.dataset.revealedAt = String(Math.round(performance.now()));
  }
  node.element.removeAttribute("aria-hidden");
  node.element.tabIndex = node.handoffToHistory ? -1 : 0;
  if (node.pendingDiff) flashDiff(node, node.pendingDiff);
  node.pendingDiff = null;
}

function staggerStep(itemCount) {
  return itemCount > 1 ? Math.min(MAX_STAGGER_STEP_MS, MAX_STAGGER_TOTAL_MS / (itemCount - 1)) : 0;
}

function numericColor(color) {
	return Number.parseInt(String(color).replace("#", ""), 16);
}

function displayPoint(key, activeIds, pendingIds) {
	const placement = currentSceneLayout?.placements.get(key);
	if (!placement) return { x: 0, y: 0 };
	const node = nodes.get(key);
	if (
		node?.renderX !== undefined
		&& (activeIds.has(key) || pendingIds.has(key))
	) {
		return { x: node.renderX, y: node.renderY };
	}
	if (viewMode === "overview") return placement.home;
	if (activeIds.has(key)) return placement.focus;
	if (pendingIds.has(key)) return placement.pending;
	return placement.historyFocus;
}

function syncHistoryScene(timeline, items, activeIds, pendingIds, dimensions) {
	if (!historyRendererAvailable || !historyRenderer || !currentSceneLayout) return;
	const dynamicIds = new Set([...activeIds, ...pendingIds, ...historyHandoffIds]);
	const summaryTargets = new Set((timeline.summaryEdges || []).map((edge) => String(edge.to)));
	const visuals = items.map((item, index) => {
		const key = itemKey(item);
		const point = displayPoint(key, activeIds, pendingIds);
		const meta = kindMeta[item.kind] || kindMeta.unknown;
		const displayItem = {
			...item,
			active: activeIds.has(key),
			pending: pendingIds.has(key),
			summary: Boolean(item.synthetic) || summaryTargets.has(key),
		};
		const text = nodeText(displayItem, index);
		return {
			id: key,
			kind: text.kind,
			title: text.title,
			detail: text.detail,
			x: point.x,
			y: point.y,
			width: dimensions.width,
			height: dimensions.height,
			color: numericColor(meta.color),
			opacity: viewMode === "overview" ? (activeIds.has(key) ? 1 : 0.54) : 0.44,
			summary: displayItem.summary,
			drawCard: !activeIds.has(key) && !pendingIds.has(key) && !historyHandoffIds.has(key),
		};
	});
	const visualById = new Map(visuals.map((visual) => [visual.id, visual]));
	const edgeVisuals = [];
	const keys = items.map(itemKey);
	for (let index = 1; index < keys.length; index += 1) {
		const from = keys[index - 1];
		const to = keys[index];
		const dynamic = dynamicIds.has(from) || dynamicIds.has(to);
		edgeVisuals.push({
			from,
			to,
			type: "sequence",
			dynamic,
			opacity: dynamic ? 0.62 : viewMode === "overview" ? 0.28 : 0.11,
		});
	}
	const summaryGroups = new Map();
	for (const edge of timeline.summaryEdges || []) {
		const target = String(edge.to);
		const group = summaryGroups.get(target) || [];
		group.push(String(edge.from));
		summaryGroups.set(target, group);
	}
	for (const [target, sources] of summaryGroups) {
		if (sources.length <= 96) {
			for (const source of sources) {
				edgeVisuals.push({
					from: source,
					to: target,
					type: "summary",
					dynamic: dynamicIds.has(source) || dynamicIds.has(target),
					opacity: activeIds.has(target) ? 0.5 : 0.25,
				});
			}
			continue;
		}
		const sourceVisuals = sources.map((id) => visualById.get(id)).filter(Boolean);
		if (!sourceVisuals.length || !visualById.has(target)) continue;
		const bundleId = `summary-bundle:${target}`;
		visuals.push({
			id: bundleId,
			kind: "summary bundle",
			title: "",
			detail: "",
			x: sourceVisuals.reduce((sum, visual) => sum + visual.x, 0) / sourceVisuals.length,
			y: sourceVisuals.reduce((sum, visual) => sum + visual.y, 0) / sourceVisuals.length,
			width: 0,
			height: 0,
			color: numericColor(kindMeta.memory.color),
			opacity: 0,
			drawCard: false,
		});
		edgeVisuals.push({
			from: bundleId,
			to: target,
			type: "bundle",
			dynamic: dynamicIds.has(target),
			opacity: 0.46,
		});
	}
	useHistoryRenderer((renderer) => {
		renderer.setScene(
			{ nodes: visuals, edges: edgeVisuals },
			{ animate: !reducedMotion, duration: 260 },
		);
		const handoffOffsets = {};
		for (const key of historyHandoffIds) {
			const node = nodes.get(key);
			const visual = visualById.get(key);
			if (!node || !visual) continue;
			const renderX = node.renderX ?? node.x;
			const renderY = node.renderY ?? node.y;
			handoffOffsets[key] = { x: renderX - visual.x, y: renderY - visual.y };
		}
		renderer.setOffsets(handoffOffsets);
	});
}

function reconcileNodes(timeline, animateNew = false) {
	const items = timeline.history || [];
	const previousSceneEpoch = currentSceneLayout?.currentEpoch ?? restoredSceneEpoch;
	const dimensions = nodeDimensions();
	const activeOrder = new Map((timeline.activeIds || []).map((id, index) => [String(id), index]));
	const activeIds = new Set(activeOrder.keys());
	const pendingKeys = (timeline.pendingIds || items.filter((item) => item.pending).map(itemKey)).map(String);
	const pendingOrder = new Map(pendingKeys.map((id, index) => [id, index]));
	const pendingIds = new Set(pendingOrder.keys());
	const pixiStartPoints = new Map();
	if (historyRendererAvailable && historyRenderer) {
		for (const key of [...activeIds, ...pendingIds]) {
			if (nodes.has(key)) continue;
			const point = readHistoryRenderer((renderer) => renderer.getNodePosition(key));
			if (point) pixiStartPoints.set(key, point);
		}
	}
	let nextSceneLayout;
	try {
		nextSceneLayout = buildLayout(timeline, dimensions);
	} catch (error) {
		document.body.dataset.layoutError = error instanceof Error ? error.message : String(error);
		console.error("ContextRail layout failed", error);
		return false;
	}
	delete document.body.dataset.layoutError;
	currentSceneLayout = nextSceneLayout;
	rebuildCameraContentBounds(currentSceneLayout, activeIds, pendingIds, dimensions);
	restoredSceneEpoch = null;
	if (viewedEpochIndex !== null) {
		viewedEpochIndex = Math.min(viewedEpochIndex, currentSceneLayout.currentEpoch);
	}
	const summaryTargets = new Set((timeline.summaryEdges || []).map((edge) => String(edge.to)));
  const enteredIds = new Set((timeline.enteredIds || []).map(String));
  const exitedIds = new Set((timeline.exitedIds || []).map(String));
	const animateDiff = timeline.revision !== lastAnimatedRevision;
	const renderHistoryInDom = historyRendererState !== "pixi";
	if (!historyRendererAvailable) historyHandoffIds.clear();
	for (const key of [...activeIds, ...pendingIds]) historyHandoffIds.delete(key);
	if (historyRendererAvailable) {
		for (const [key, node] of nodes) {
			if ((node.item.active || node.item.pending) && !activeIds.has(key) && !pendingIds.has(key)) {
				historyHandoffIds.add(key);
			}
		}
	}
	const itemIds = new Set(items.map(itemKey));
	for (const key of [...historyHandoffIds]) {
		if (!itemIds.has(key)) historyHandoffIds.delete(key);
	}
	const domWanted = renderHistoryInDom
		? fallbackDomIds(items, activeIds, pendingIds)
		: new Set([...activeIds, ...pendingIds, ...historyHandoffIds]);
	document.body.dataset.domNodeCount = String(domWanted.size);
	const newKeys = [...domWanted].filter((key) => !nodes.has(key));
	const animateCreated = animateNew && animateDiff && !reducedMotion && newKeys.length <= MAX_ANIMATED_NODES;
	let diffAnimationBudget = animateDiff && !reducedMotion ? MAX_ANIMATED_NODES : 0;
	const step = animateCreated ? staggerStep(newKeys.length) : 0;
  const now = performance.now();
  const revealTimes = new Map(
    step > 0 ? newKeys.slice(1).map((key, index) => [key, now + (index + 1) * step]) : [],
  );
  const revealOrders = new Map(step > 0 ? newKeys.map((key, index) => [key, index]) : []);
  if (step > 0) {
    world.dataset.lastStaggerCount = String(newKeys.length);
    world.dataset.lastStaggerStep = String(Math.round(step));
    world.dataset.lastStaggerDuration = String(Math.round(step * (newKeys.length - 1)));
	  }
	const newNodeFragment = document.createDocumentFragment();
	let createdNodes = 0;
	items.forEach((item, index) => {
    const key = itemKey(item);
	if (!domWanted.has(key)) return;
	const active = activeIds.has(key);
	const pending = pendingIds.has(key);
	const displayItem = { ...item, active, pending, summary: Boolean(item.synthetic) || summaryTargets.has(key) };
	const placement = currentSceneLayout.placements.get(key);
	if (!placement) return;
	const target = nodeLayout(placement, active, pending);
    let node = nodes.get(key);
    const created = !node;
	    if (!node) {
			const pixiStart = pixiStartPoints.get(key);
			node = createNode(
				displayItem,
				index,
				target,
				dimensions,
				revealTimes.get(key) || 0,
				pixiStart ? { ...pixiStart, opacity: historyVisualOpacity() } : null,
			);
	      nodes.set(key, node);
	      newNodeFragment.appendChild(node.element);
	      createdNodes += 1;
		const revealOrder = revealOrders.get(key);
		if (revealOrder !== undefined) {
			node.element.dataset.revealOrder = String(revealOrder);
			node.element.dataset.revealed = String(node.revealed);
			if (node.revealed) node.element.dataset.revealedAt = String(Math.round(now));
		}
    } else {
      if (node.removeTimer) clearTimeout(node.removeTimer);
      node.removeTimer = null;
		if (node.revealed) {
			node.element.removeAttribute("aria-hidden");
		}
		updateNodeContent(node, displayItem, index);
    }
	node.homeX = target.homeX;
	node.homeY = target.homeY;
	node.focusX = target.focusX;
	node.focusY = target.focusY;
		node.pendingX = target.pendingX;
		node.pendingY = target.pendingY;
		node.handoffToHistory = historyHandoffIds.has(key);
		node.element.tabIndex = node.revealed && !node.handoffToHistory ? 0 : -1;
		if (node.width !== dimensions.width || node.height !== dimensions.height) {
			node.width = dimensions.width;
			node.height = dimensions.height;
			for (const edgeKey of node.edgeKeys) dirtyEdges.add(edgeKey);
		}
    node.targetX = target.x;
    node.targetY = target.y;
		node.revealOpacity = active
			? 1
			: pending
				? (viewMode === "overview" ? 0.62 : 0.82)
				: node.handoffToHistory
					? historyVisualOpacity()
					: viewMode === "overview" ? 0.38 : 0.2;
		if (node.revealed) node.targetOpacity = node.revealOpacity;
		if (created && !animateCreated && !pixiStartPoints.has(key)) {
			node.x = node.targetX;
			node.y = node.targetY;
			node.opacity = node.targetOpacity;
		}
		const diff = enteredIds.has(key) ? "entered" : exitedIds.has(key) ? "exited" : null;
		if (diff && diffAnimationBudget > 0) {
			diffAnimationBudget -= 1;
			if (created && !node.revealed) node.pendingDiff = diff;
			else flashDiff(node, diff);
		}
    if (
      created
      || !node.revealed
      || differs(node.x, node.targetX, POSITION_EPSILON)
      || differs(node.y, node.targetY, POSITION_EPSILON)
      || differs(node.opacity, node.targetOpacity, OPACITY_EPSILON)
    ) markNodeMoving(node);
	});
	if (createdNodes > 0) world.appendChild(newNodeFragment);

	for (const [key, node] of nodes) {
		if (domWanted.has(key)) continue;
		if (historyRendererAvailable) {
			if (node.removeTimer) clearTimeout(node.removeTimer);
			movingNodes.delete(node);
			node.element.remove();
			nodes.delete(key);
			continue;
		}
		if (node.removeTimer) continue;
	const placement = currentSceneLayout.placements.get(key);
    node.revealed = true;
    node.revealAt = 0;
    node.pendingDiff = null;
	node.targetOpacity = 0;
	if (placement) {
		const exitTarget = viewMode === "window" ? placement.historyFocus : placement.home;
		node.targetX = exitTarget.x;
		node.targetY = exitTarget.y;
	} else {
		node.targetX -= 170;
		node.targetY += 34;
	}
    node.element.setAttribute("aria-hidden", "true");
    node.element.tabIndex = -1;
    markNodeMoving(node);
    node.removeTimer = setTimeout(() => {
      movingNodes.delete(node);
      node.element.remove();
      nodes.delete(key);
    }, reducedMotion ? 20 : 720);
	}

	if (historyRendererAvailable) {
		for (const edge of edges.values()) edge.path.remove();
		edges.clear();
		dirtyEdges.clear();
		syncHistoryScene(timeline, items, activeIds, pendingIds, dimensions);
	} else {
		reconcileEdges(timeline, items, activeIds);
	}
	updateBounds(currentSceneLayout, previousSceneEpoch, items.length > 0);
	lastAnimatedRevision = timeline.revision;
	return true;
}

function reconcileEdges(timeline, items, activeIds) {
	  const desired = new Set();
		const newEdgeFragment = document.createDocumentFragment();
		let createdEdges = 0;
		const addEdge = (from, to, type) => {
			if (!nodes.has(from) || !nodes.has(to)) return;
		const key = JSON.stringify([type, from, to]);
		desired.add(key);
		const isActive = activeIds.has(from) && activeIds.has(to);
		let edge = edges.get(key);
			if (!edge) {
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("class", `edge ${type} pending`);
					newEdgeFragment.appendChild(path);
					createdEdges += 1;
					edge = { key, from, to, type, path, active: null };
					edges.set(key, edge);
					dirtyEdges.add(key);
					nodes.get(from).edgeKeys.add(key);
					nodes.get(to).edgeKeys.add(key);
				}
				if (edge.active !== isActive) {
					edge.active = isActive;
					edge.path.classList.toggle("inactive", !isActive);
				}
			};
	const keys = items.map(itemKey);
  for (let index = 1; index < keys.length; index += 1) {
		addEdge(keys[index - 1], keys[index], "sequence");
  }
		for (const edge of timeline.summaryEdges || []) addEdge(String(edge.from), String(edge.to), "summary");
		if (createdEdges > 0) edgeGroup.appendChild(newEdgeFragment);

  for (const [key, edge] of edges) {
    if (desired.has(key)) continue;
    edge.path.classList.add("pending");
    setTimeout(() => edge.path.remove(), reducedMotion ? 20 : 280);
    nodes.get(edge.from)?.edgeKeys.delete(key);
    nodes.get(edge.to)?.edgeKeys.delete(key);
    dirtyEdges.delete(key);
    edges.delete(key);
  }
	if (dirtyEdges.size) scheduleRender();
}

function fitScaleForBounds(bounds) {
	const compact = isShortLandscapeLayout();
	const availableWidth = graphWidth() - (compact ? 24 : 48);
	const viewport = graphViewport();
	const padding = compact ? 32 : 100;
	return Math.max(MIN_CAMERA_SCALE, Math.min(
		availableWidth / Math.max(compact ? 180 : 320, bounds.width + padding),
		viewport.height / Math.max(compact ? 120 : 260, bounds.height + padding),
		1.12,
	));
}

function interactiveScaleFloor() {
	const viewedBounds = viewedEpochIndex === null
		? null
		: currentSceneLayout?.epochs[viewedEpochIndex]?.bounds;
	const naturalFitScale = fitScaleForBounds(viewedBounds || fitTarget);
	return sceneEngine.interactiveMinimumScale(naturalFitScale, MIN_CAMERA_SCALE);
}

function constrainCameraWithin(candidate, bounds) {
	if (!bounds) return candidate;
	const viewport = graphViewport();
	return sceneEngine.constrainCameraToBounds(
		candidate,
		bounds,
		{ width: viewport.width, height: viewport.height },
		MIN_VISIBLE_SCENE_PIXELS,
	);
}

function constrainCameraToRegions(candidate, regions) {
	const viewport = graphViewport();
	return sceneEngine.constrainCameraToContent(
		candidate,
		regions,
		{ width: viewport.width, height: viewport.height },
		MIN_VISIBLE_SCENE_PIXELS,
	);
}

function constrainCamera(candidate, requireContent = false) {
	const bounds = currentSceneLayout?.worldBounds;
	if (!bounds) return candidate;
	const viewport = graphViewport();
	const dimensions = { width: viewport.width, height: viewport.height };
	const bounded = sceneEngine.constrainCameraToBounds(
		candidate,
		bounds,
		dimensions,
		MIN_VISIBLE_SCENE_PIXELS,
	);
	const reachedWorldEdge = differs(candidate.x, bounded.x, POSITION_EPSILON)
		|| differs(candidate.y, bounded.y, POSITION_EPSILON);
	if (!requireContent && !reachedWorldEdge) return bounded;
	return constrainCameraToRegions(bounded, cameraContentBounds);
}

function updateBounds(layout, previousSceneEpoch = null, hasItems = true) {
	const activeBounds = layout.activeBounds;
	const visibleBounds = viewMode === "window" ? layout.focusBounds : layout.homeBounds;
	const worldBounds = layout.worldBounds;
	if (hasItems) windowFrame.toggleAttribute("hidden", false);
	else windowFrame.toggleAttribute("hidden", true);
	const maxX = worldBounds.x + worldBounds.width;
	const maxY = worldBounds.y + worldBounds.height;
	if (
		differs(frameTarget.x, activeBounds.x, POSITION_EPSILON)
		|| differs(frameTarget.y, activeBounds.y, POSITION_EPSILON)
		|| differs(frameTarget.width, activeBounds.width, POSITION_EPSILON)
		|| differs(frameTarget.height, activeBounds.height, POSITION_EPSILON)
	) {
		frameTarget = activeBounds;
		markFrameDirty();
	}
	fitTarget = visibleBounds;

	const worldWidth = Math.max(1000, maxX + 260);
	const worldHeight = Math.max(800, maxY + 240);
  world.style.width = `${worldWidth}px`;
  world.style.height = `${worldHeight}px`;
  edgeLayer.setAttribute("width", String(worldWidth));
  edgeLayer.setAttribute("height", String(worldHeight));
	if (!freeCamera) {
		fitView(false);
		return;
	}

	const minimumScale = interactiveScaleFloor();
	const previousTarget = cameraTarget;
	cameraTarget = constrainCamera({
		...cameraTarget,
		scale: Math.min(MAX_CAMERA_SCALE, Math.max(minimumScale, cameraTarget.scale)),
	});
	const epochChanged = previousSceneEpoch !== null && previousSceneEpoch !== layout.currentEpoch;
	if (epochChanged && viewedEpochIndex === null) {
		cameraTarget = constrainCameraWithin(cameraTarget, activeBounds);
		cameraTarget = constrainCameraToRegions(cameraTarget, activeCameraContentBounds);
	}
	if (
		differs(previousTarget.x, cameraTarget.x, POSITION_EPSILON)
		|| differs(previousTarget.y, cameraTarget.y, POSITION_EPSILON)
		|| differs(previousTarget.scale, cameraTarget.scale, SCALE_EPSILON)
	) markCameraDirty();
}

function fitView(reset = true) {
  if (reset) {
	freeCamera = false;
	viewedEpochIndex = null;
  }
	const scale = fitScaleForBounds(fitTarget);
  const nextTarget = {
    x: fitTarget.x + fitTarget.width / 2,
    y: fitTarget.y + fitTarget.height / 2 + 8,
	scale,
  };
	const targetChanged = differs(cameraTarget.x, nextTarget.x, POSITION_EPSILON)
		|| differs(cameraTarget.y, nextTarget.y, POSITION_EPSILON)
		|| differs(cameraTarget.scale, nextTarget.scale, SCALE_EPSILON);
	cameraTarget = nextTarget;
  if (reducedMotion) camera = { ...cameraTarget };
	if (targetChanged || cameraDirty) markCameraDirty();
}

function borderPoint(node, targetX, targetY) {
  const dx = targetX - node.renderX;
  const dy = targetY - node.renderY;
  if (!dx && !dy) return [node.renderX, node.renderY];
  const halfWidth = node.width / 2 + 6;
  const halfHeight = node.height / 2 + 6;
  const scale = Math.min(
    dx ? halfWidth / Math.abs(dx) : Number.POSITIVE_INFINITY,
    dy ? halfHeight / Math.abs(dy) : Number.POSITIVE_INFINITY,
    1,
  );
  return [node.renderX + dx * scale, node.renderY + dy * scale];
}

function updateEdge(edge) {
  const from = nodes.get(edge.from);
  const to = nodes.get(edge.to);
  if (!from || !to || from.renderX === undefined || to.renderX === undefined) return false;
  edge.path.classList.toggle("pending", !from.revealed || !to.revealed);
  const [startX, startY] = borderPoint(from, to.renderX, to.renderY);
  const [endX, endY] = borderPoint(to, from.renderX, from.renderY);
  const midX = (startX + endX) / 2;
  const curveSize = edge.type === "summary" ? 34 : 18;
  const curve = (from.index % 2 === 0 ? -1 : 1) * curveSize;
  edge.path.setAttribute("d", `M ${startX} ${startY} Q ${midX} ${(startY + endY) / 2 + curve} ${endX} ${endY}`);
  return true;
}

function renderFrame(time) {
  animationFrameId = null;
  animationFrameUsesTimeout = false;
  renderLoopActive = true;
  const settleImmediately = reducedMotion || document.hidden;
  const ease = settleImmediately ? 1 : 0.085;
  const opacityEase = settleImmediately ? 1 : 0.12;
  let nodeUpdates = 0;
  let edgeUpdates = 0;
  let keepAlive = false;
	const completedHistoryHandoffs = [];

  const cameraMoving = cameraDirty
    || differs(camera.x, cameraTarget.x, POSITION_EPSILON)
    || differs(camera.y, cameraTarget.y, POSITION_EPSILON)
    || differs(camera.scale, cameraTarget.scale, SCALE_EPSILON);
	if (cameraMoving) {
		const viewport = graphViewport();
		camera.x = approach(camera.x, cameraTarget.x, ease, POSITION_EPSILON);
    camera.y = approach(camera.y, cameraTarget.y, ease, POSITION_EPSILON);
    camera.scale = approach(camera.scale, cameraTarget.scale, ease, SCALE_EPSILON);
		world.style.transform = `translate(${viewport.centerX - camera.x * camera.scale}px, ${viewport.centerY - camera.y * camera.scale}px) scale(${camera.scale})`;
		useHistoryRenderer((renderer) => renderer.setCamera({
			x: camera.x,
			y: camera.y,
			scale: camera.scale,
