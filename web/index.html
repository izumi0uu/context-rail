<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ContextRail</title>
<style>
  :root {
    --canvas: #f7f8f6;
    --surface: #ffffff;
    --ink: #1d1f23;
    --muted: #686d75;
    --quiet: #9ba0a8;
    --hair: #dfe2dc;
    --indigo: #574ce3;
    --green: #4e8a35;
    --teal: #087b75;
    --amber: #a36f26;
    --danger: #b54545;
    --shadow: 0 8px 22px rgba(36, 39, 43, 0.08);
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    letter-spacing: 0;
  }

  button { font: inherit; letter-spacing: 0; }

  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    clip-path: inset(var(--graph-clip-top, 0px) 0 var(--graph-clip-bottom, 0px) 0);
    touch-action: none;
    cursor: grab;
  }

  #viewport.dragging { cursor: grabbing; }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 100px;
    transform-origin: 0 0;
  }

  #world.moving { will-change: transform; }

  #edge-layer {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
  }

  #window-frame {
    fill: rgba(255, 255, 255, 0.24);
    stroke: var(--indigo);
    stroke-width: 2;
    stroke-dasharray: 8 7;
    opacity: 0.72;
	transition: opacity 240ms ease;
  }

  body[data-mode="overview"] #window-frame { opacity: 0; }

  body[data-phase="compacting"] #window-frame {
    stroke: var(--green);
    stroke-dasharray: 4 5;
  }

  .edge {
    fill: none;
    stroke: #c7cbc4;
    stroke-width: 1.6;
    opacity: 0.68;
	transition: opacity 280ms ease, stroke 280ms ease;
  }

  .edge.pending { opacity: 0; }
	.edge.inactive { opacity: 0.12; }
	.edge.summary {
		stroke: var(--green);
		stroke-width: 1.8;
		stroke-dasharray: 5 5;
		opacity: 0.58;
	}
	.edge.summary.inactive { opacity: 0.2; }

	  .node {
	    position: absolute;
	    width: 176px;
	    height: 92px;
    border: 1.5px solid var(--node-color, var(--hair));
    border-radius: 8px;
    padding: 13px 14px 12px;
    background: rgba(255, 255, 255, 0.96);
    color: var(--ink);
    text-align: left;
    box-shadow: var(--shadow);
	    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    opacity: 0;
    transform-origin: center;
  }

  .node.moving { will-change: transform, opacity; }
	.node:active { cursor: grabbing; }

	  .node:hover {
    border-width: 2px;
    outline: none;
  }

  .node::before {
    content: "";
    position: absolute;
    top: 0;
    left: 13px;
    width: 28px;
    height: 3px;
    background: var(--node-color, var(--quiet));
  }

  .node-kind {
    display: block;
    color: var(--node-color, var(--quiet));
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
  }

	  .node-title {
	    display: block;
	    margin-top: 9px;
	    overflow: hidden;
	    color: var(--ink);
	    font-size: 16px;
	    font-weight: 700;
	    line-height: 1.18;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	  }

	  .node-detail {
	    display: block;
	    margin-top: 7px;
	    overflow: hidden;
	    color: var(--muted);
	    font-family: var(--mono);
	    font-size: 10px;
	    line-height: 1.35;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	  }

  .node.aggregate {
    border-style: dashed;
    background: rgba(247, 248, 246, 0.96);
    box-shadow: none;
  }

	.node.inactive {
		box-shadow: none;
		filter: grayscale(0.42) saturate(0.55);
	}

	.node.inactive::before { opacity: 0.48; }

	.node.pending-context {
		border-style: dashed;
		background: rgba(255, 255, 255, 0.82);
		box-shadow: 0 5px 16px rgba(36, 39, 43, 0.06);
		filter: none;
	}

	.node.pending-context::before { opacity: 0.82; }

	.node.active {
		box-shadow: 0 8px 22px rgba(36, 39, 43, 0.08), 0 0 0 3px rgba(87, 76, 227, 0.08);
	}

	.node.memory.active {
		box-shadow: 0 8px 22px rgba(36, 39, 43, 0.08), 0 0 0 3px rgba(78, 138, 53, 0.1);
	}

	.node.entered { animation: context-enter 620ms cubic-bezier(0.2, 0.75, 0.2, 1); }
	.node.exited { animation: context-exit 520ms ease-out; }

	@keyframes context-enter {
		0% { filter: brightness(1.18); }
		45% { filter: brightness(1.06); }
		100% { filter: none; }
	}

	@keyframes context-exit {
		0% { filter: grayscale(0) saturate(1); }
		100% { filter: grayscale(0.42) saturate(0.55); }
	}

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 22px;
    pointer-events: none;
  }

  #brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  #brand-name {
    font-size: 14px;
    font-weight: 760;
    line-height: 1;
  }

  #connection {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
  }

  #connection-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
  }

  #connection[data-state="live"] #connection-dot { background: var(--green); }
  #connection[data-state="offline"] #connection-dot { background: var(--danger); }

  #model {
    max-width: min(48vw, 480px);
    overflow: hidden;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.35;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #legend {
    position: fixed;
    top: 52px;
    left: 22px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    max-width: min(620px, calc(100vw - 44px));
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    pointer-events: none;
  }

  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-item i { width: 7px; height: 7px; border-radius: 50%; background: var(--legend-color); }

  #sessionbar {
    position: fixed;
    top: 76px;
    left: 22px;
    right: 22px;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    pointer-events: none;
  }

  #follow-active {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 7px;
    height: 30px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
  }

  #follow-active input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  #follow-track {
    position: relative;
    width: 28px;
    height: 16px;
    border: 1px solid #c9cdc6;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    transition: border-color 160ms ease, background 160ms ease;
  }

  #follow-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--quiet);
    transition: transform 160ms ease, background 160ms ease;
  }

  #follow-active input:checked + #follow-track {
    border-color: var(--indigo);
    background: rgba(87, 76, 227, 0.1);
  }

  #follow-active input:checked + #follow-track::after {
    background: var(--indigo);
    transform: translateX(12px);
  }

  #follow-active input:focus-visible + #follow-track { outline: 2px solid var(--indigo); outline-offset: 2px; }

  #session-tabs {
    display: flex;
    flex: 1 1 auto;
    gap: 6px;
    min-width: 0;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
    pointer-events: auto;
  }

  #session-tabs::-webkit-scrollbar { display: none; }

  .session-tab {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 7px;
    max-width: 220px;
    height: 30px;
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 0 10px;
    background: rgba(255, 255, 255, 0.86);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(36, 39, 43, 0.04);
  }

  .session-tab:hover { border-color: #c5c8c2; color: var(--ink); }
  .session-tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .session-tab[data-connected="false"] { opacity: 0.48; }

  .session-dot {
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--quiet);
  }

  .session-tab[data-active="true"] .session-dot { background: var(--green); }
  .session-tab[data-unread="true"] .session-dot { box-shadow: 0 0 0 3px rgba(87, 76, 227, 0.14); }
  .session-tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-tab-process { color: var(--quiet); font-size: 8px; }
  .session-tab[aria-selected="true"] .session-tab-process { color: rgba(255, 255, 255, 0.62); }

  #toolbar {
    position: fixed;
    right: 22px;
    bottom: 86px;
    z-index: 25;
    display: flex;
    align-items: center;
    padding: 3px;
    border: 1px solid var(--hair);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 3px 12px rgba(36, 39, 43, 0.07);
  }

  #toolbar button {
    min-width: 68px;
    height: 32px;
    border: 0;
    border-radius: 5px;
    padding: 0 11px;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
  }

  #toolbar button:hover { color: var(--indigo); }
  #toolbar button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #toolbar #fit-view { min-width: 44px; border-left: 1px solid var(--hair); border-radius: 0; }

  #empty-state {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 11px;
    pointer-events: none;
    transition: opacity 240ms ease;
  }

  #empty-state.hidden { opacity: 0; }

  #tooltip {
    position: fixed;
    z-index: 40;
    max-width: 250px;
    padding: 9px 11px;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease;
    white-space: pre-line;
  }

  #tooltip.visible { opacity: 0.96; }

  #detail-backdrop {
    position: fixed;
    inset: 0;
    z-index: 44;
    border: 0;
    padding: 0;
    background: rgba(29, 31, 35, 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }

  #detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    display: flex;
    width: min(480px, 100vw);
    border-left: 1px solid var(--hair);
    background: var(--surface);
    box-shadow: -12px 0 32px rgba(36, 39, 43, 0.12);
    flex-direction: column;
    transform: translateX(102%);
    transition: transform 220ms cubic-bezier(0.2, 0.75, 0.2, 1);
  }

  body[data-detail-open="true"] #detail-backdrop {
    opacity: 1;
    pointer-events: auto;
  }

  body[data-detail-open="true"] #detail-panel { transform: translateX(0); }

  #detail-header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--hair);
  }

  #detail-kind {
    color: var(--detail-color, var(--quiet));
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
  }

  #detail-title {
    margin: 7px 0 0;
    font-size: 22px;
    font-weight: 730;
    line-height: 1.2;
  }

  #detail-close {
    display: grid;
    width: 34px;
    height: 34px;
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    place-items: center;
  }

  #detail-close:hover { border-color: var(--ink); color: var(--ink); }
  #detail-close:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  #detail-close span { font-size: 22px; font-weight: 400; line-height: 1; }

  #detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-bottom: 1px solid var(--hair);
  }

  .detail-meta-cell {
    min-width: 0;
    padding: 13px 22px;
  }

  .detail-meta-cell + .detail-meta-cell { border-left: 1px solid var(--hair); }
  .detail-meta-cell span {
    display: block;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1;
    text-transform: uppercase;
  }

  .detail-meta-cell strong {
    display: block;
    margin-top: 6px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 650;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #detail-content {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 2px 22px 32px;
  }

  .detail-block {
    padding: 20px 0;
    border-bottom: 1px solid var(--hair);
  }

  .detail-block:last-child { border-bottom: 0; }
  .detail-block-label {
    display: block;
    margin-bottom: 10px;
    color: var(--detail-color, var(--quiet));
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .detail-block pre {
    margin: 0;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    tab-size: 2;
    white-space: pre-wrap;
    user-select: text;
  }

  .detail-block[data-type="thinking"] pre { color: var(--muted); }
  .detail-block img {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--hair);
    border-radius: 4px;
  }

  #detail-empty {
    margin: 0;
    padding: 24px 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.65;
  }

  #statusbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto auto;
    align-items: center;
    gap: 28px;
    min-height: 64px;
    padding: 12px 22px;
    border-top: 1px solid var(--hair);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
  }

  #usage-wrap { min-width: 0; }

  .status-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
  }

  #usage-value { color: var(--ink); }

  #usage-track {
    width: 100%;
    height: 4px;
    margin-top: 9px;
    overflow: hidden;
    background: #e5e7e2;
  }

  #usage-fill {
    width: 0;
    height: 100%;
    background: var(--indigo);
    transition: width 500ms cubic-bezier(0.2, 0.7, 0.2, 1), background 240ms ease;
  }

  #usage-fill[data-level="high"] { background: var(--amber); }
  #usage-fill[data-level="critical"] { background: var(--danger); }

  .stat {
    min-width: 82px;
    text-align: right;
  }

  .stat strong {
    display: block;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.1;
  }

  .stat span {
    display: block;
    margin-top: 5px;
    color: var(--quiet);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1;
    text-transform: uppercase;
  }

  @media (max-width: 720px) {
    #topbar { padding: 16px; }
    #legend { top: 48px; left: 16px; gap: 7px 10px; }
    #sessionbar { top: 72px; left: 16px; right: 16px; gap: 8px; }
    #follow-label { display: none; }
    .session-tab { max-width: 156px; padding: 0 9px; }
    .session-tab-process { display: none; }
    #model { max-width: 42vw; }
    #toolbar { right: 14px; bottom: 112px; }
    #toolbar button { min-width: 62px; padding: 0 8px; }
    #statusbar {
      grid-template-columns: 1fr auto;
      gap: 10px 16px;
      min-height: 92px;
      padding: 12px 16px;
    }
    #usage-wrap { grid-column: 1 / -1; }
    .stat { min-width: 0; text-align: left; }
    .stat:last-child { text-align: right; }
    .node { width: 164px; }
    #detail-panel { width: 100vw; }
    #detail-header { padding: 18px 18px 15px; }
    .detail-meta-cell { padding: 12px 18px; }
    #detail-content { padding: 2px 18px 28px; }
  }

  @media (max-height: 420px) and (orientation: landscape) {
    #topbar { padding: 10px 14px; }
    #legend { display: none; }
    #sessionbar { top: 44px; left: 14px; right: 202px; }
    #toolbar { top: 42px; right: 14px; bottom: auto; }
    #toolbar button { min-width: 56px; height: 30px; padding: 0 8px; }
    #toolbar #fit-view { min-width: 40px; }
    #statusbar {
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 16px;
      min-height: 56px;
      padding: 8px 14px;
    }
    #usage-wrap { grid-column: auto; }
    #usage-track { margin-top: 7px; }
    .stat { min-width: 72px; text-align: right; }
    .stat:last-child { text-align: right; }
    .stat span { margin-top: 3px; }
    .node { height: 64px; padding: 9px 10px; }
    .node::before { left: 10px; }
    .node-title { margin-top: 6px; font-size: 20px; }
    .node-detail { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
	    *, *::before, *::after {
	      animation: none !important;
	      scroll-behavior: auto !important;
	      transition-duration: 0.01ms !important;
	    }
  }
</style>
</head>
<body data-phase="idle" data-mode="window">
<div id="viewport" aria-label="Context graph canvas">
  <div id="world">
    <svg id="edge-layer" width="100" height="100" aria-hidden="true">
      <rect id="window-frame" x="0" y="0" width="0" height="0" rx="8"></rect>
      <g id="edges"></g>
    </svg>
  </div>
</div>

<header id="topbar">
  <div id="brand">
    <span id="brand-name">ContextRail</span>
    <span id="connection" data-state="waiting" aria-live="polite">
      <i id="connection-dot"></i>
      <span id="connection-label">waiting</span>
    </span>
  </div>
  <div id="model">no model</div>
</header>

<div id="legend" aria-label="Context roles">
  <span class="legend-item" style="--legend-color:#1d1f23"><i></i>system</span>
  <span class="legend-item" style="--legend-color:#4e8a35"><i></i>memory</span>
  <span class="legend-item" style="--legend-color:#8b3f6f"><i></i>developer</span>
  <span class="legend-item" style="--legend-color:#574ce3"><i></i>user</span>
  <span class="legend-item" style="--legend-color:#087b75"><i></i>assistant</span>
  <span class="legend-item" style="--legend-color:#a36f26"><i></i>tool</span>
</div>

<nav id="sessionbar" aria-label="Observed sessions">
  <label id="follow-active">
    <input id="follow-toggle" type="checkbox" aria-label="Follow active" checked>
    <span id="follow-track" aria-hidden="true"></span>
    <span id="follow-label">Follow active</span>
  </label>
  <div id="session-tabs" role="tablist" aria-label="Sessions"></div>
</nav>

<div id="toolbar" role="group" aria-label="Graph view">
  <button id="window-mode" type="button" aria-pressed="true">Window</button>
  <button id="overview-mode" type="button" aria-pressed="false">Overview</button>
  <button id="fit-view" type="button" title="Fit graph to view">Fit</button>
</div>

<div id="empty-state">waiting for context</div>
<div id="tooltip" role="tooltip"></div>

<button id="detail-backdrop" type="button" aria-label="Close item detail" tabindex="-1"></button>
<aside id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true">
  <header id="detail-header">
    <div>
      <span id="detail-kind">Context</span>
      <h2 id="detail-title">Item detail</h2>
    </div>
    <button id="detail-close" type="button" aria-label="Close item detail" title="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </header>
  <div id="detail-meta">
    <div class="detail-meta-cell"><span>context state</span><strong id="detail-state">outside context</strong></div>
    <div class="detail-meta-cell"><span>model role</span><strong id="detail-role">unknown</strong></div>
  </div>
  <div id="detail-content"></div>
</aside>

<footer id="statusbar">
  <div id="usage-wrap">
    <div class="status-label"><span>context usage</span><span id="usage-value">? / ?</span></div>
    <div id="usage-track" role="progressbar" aria-label="Context usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="usage-fill"></div>
    </div>
  </div>
  <div class="stat"><strong id="item-count">0 / 0</strong><span>active / history</span></div>
  <div class="stat"><strong id="phase">idle</strong><span>phase</span></div>
</footer>

<script>
"use strict";

/* Interaction model adapted from graph-deck by Yohei Nakajima. */

const eventCapabilityToken = (() => {
	const storageKey = "context-rail-event-token";
	const fragmentToken = new URLSearchParams(location.hash.slice(1)).get("token");
	if (fragmentToken !== null) {
		try {
			sessionStorage.setItem(storageKey, fragmentToken);
		} catch {
			// The current page can still use the fragment capability when storage is unavailable.
		}
		history.replaceState(history.state, "", `${location.pathname}${location.search}`);
		return fragmentToken;
	}
	try {
		return sessionStorage.getItem(storageKey);
	} catch {
		return null;
	}
})();

const $ = (selector) => document.querySelector(selector);
const viewport = $("#viewport");
const world = $("#world");
const edgeLayer = $("#edge-layer");
const edgeGroup = $("#edges");
const windowFrame = $("#window-frame");
const tooltip = $("#tooltip");
const detailBackdrop = $("#detail-backdrop");
const detailPanel = $("#detail-panel");
const detailContent = $("#detail-content");
const sessionBar = $("#sessionbar");
const sessionTabs = $("#session-tabs");
const followToggle = $("#follow-toggle");
const toolbar = $("#toolbar");
const statusBar = $("#statusbar");
const reducedMotionQuery = matchMedia("(prefers-reduced-motion: reduce)");
let reducedMotion = reducedMotionQuery.matches;
const MAX_STAGGER_TOTAL_MS = 280;
const MAX_STAGGER_STEP_MS = 44;
const MAX_ANIMATED_NODES = 120;
const MIN_CAMERA_SCALE = 0.004;
const MOBILE_BREAKPOINT = 720;
const NODE_WIDTH_DESKTOP = 176;
const NODE_WIDTH_MOBILE = 164;
const NODE_HEIGHT = 92;
const NODE_HEIGHT_SHORT_LANDSCAPE = 64;
const POSITION_EPSILON = 0.08;
const OPACITY_EPSILON = 0.002;
const SCALE_EPSILON = 0.0002;

const kindMeta = {
  system: { label: "System", color: "#1d1f23", lane: -54 },
  memory: { label: "Memory", color: "#4e8a35", lane: 54 },
  developer: { label: "Developer", color: "#8b3f6f", lane: -42 },
  user: { label: "User", color: "#574ce3", lane: -25 },
  assistant: { label: "Assistant", color: "#087b75", lane: 28 },
  tool: { label: "Tool", color: "#a36f26", lane: 68 },
  unknown: { label: "Context", color: "#7b8087", lane: 0 },
};

const nodes = new Map();
const edges = new Map();
const movingNodes = new Set();
const dirtyEdges = new Set();
const sessionStates = new Map();
const deltaTransfers = new Map();
const sessionViews = new Map();
const unreadSessions = new Set();
let sessionSummaries = [];
let selectedStreamId = null;
let activeStreamId = null;
let followActive = true;
let currentPayload = null;
let viewMode = "window";
let freeCamera = false;
let lastAnimatedRevision = -1;
let hoveredNode = null;
let detailSelection = null;
let camera = { x: 500, y: 420, scale: 0.8 };
let cameraTarget = { x: 500, y: 420, scale: 0.8 };
let frameBox = { x: 180, y: 220, width: 640, height: 360 };
let frameTarget = { ...frameBox };
let fitTarget = { ...frameBox };
let graphViewportBounds = null;
let cameraDirty = true;
let frameDirty = true;
let animationFrameId = null;
let animationFrameUsesTimeout = false;
let renderLoopActive = false;
const renderStats = {
  frames: 0,
  totalNodeUpdates: 0,
  totalEdgeUpdates: 0,
  lastFrameNodeUpdates: 0,
  lastFrameEdgeUpdates: 0,
  peakFrameNodeUpdates: 0,
  peakFrameEdgeUpdates: 0,
  lastFrameAt: null,
  sleepingSince: null,
};

function differs(left, right, epsilon) {
  return Math.abs(left - right) > epsilon;
}

function approach(current, target, ease, epsilon) {
  if (!differs(current, target, epsilon)) return target;
  const next = current + (target - current) * ease;
  return differs(next, target, epsilon) ? next : target;
}

function scheduleRender() {
  if (animationFrameId !== null) return;
  renderLoopActive = true;
  renderStats.sleepingSince = null;
  animationFrameUsesTimeout = document.hidden;
  animationFrameId = animationFrameUsesTimeout
    ? setTimeout(() => renderFrame(performance.now()), 0)
    : requestAnimationFrame(renderFrame);
}

function markNodeMoving(node) {
  movingNodes.add(node);
  node.element.classList.add("moving");
	scheduleRender();
}

function markCameraDirty() {
  cameraDirty = true;
  world.classList.add("moving");
	scheduleRender();
}

function markFrameDirty() {
  frameDirty = true;
  scheduleRender();
}

function isMobileLayout() {
	return innerWidth <= MOBILE_BREAKPOINT;
}

function shortLandscapeColumns(viewportWidth, viewportHeight, itemCount) {
	if (viewportHeight > 420 || viewportWidth <= viewportHeight) return 0;
	return Math.min(5, Math.max(1, itemCount));
}

function isShortLandscapeLayout() {
	return shortLandscapeColumns(innerWidth, innerHeight, 1) > 0;
}

function availableGraphViewport(viewportHeight, sessionBottom, toolbarTop, statusTop) {
	const heightLimit = Math.max(1, viewportHeight);
	const top = Math.min(heightLimit, Math.max(0, sessionBottom));
	const bottom = Math.max(top, Math.min(heightLimit, toolbarTop, statusTop));
	return {
		top,
		bottom,
		height: Math.max(1, bottom - top),
		centerY: top + (bottom - top) / 2,
	};
}

function syncGraphViewport() {
		const bounds = availableGraphViewport(
			innerHeight,
			sessionBar.getBoundingClientRect().bottom,
			isShortLandscapeLayout() ? innerHeight : toolbar.getBoundingClientRect().top,
			statusBar.getBoundingClientRect().top,
		);
		const topInset = `${bounds.top}px`;
		const bottomInset = `${Math.max(0, innerHeight - bounds.bottom)}px`;
		const boundsChanged = !graphViewportBounds
			|| differs(graphViewportBounds.top, bounds.top, POSITION_EPSILON)
			|| differs(graphViewportBounds.bottom, bounds.bottom, POSITION_EPSILON);
		const clipChanged = viewport.style.getPropertyValue("--graph-clip-top") !== topInset
			|| viewport.style.getPropertyValue("--graph-clip-bottom") !== bottomInset;
		if (clipChanged) {
			viewport.style.setProperty("--graph-clip-top", topInset);
			viewport.style.setProperty("--graph-clip-bottom", bottomInset);
		}
		graphViewportBounds = bounds;
		return boundsChanged || clipChanged;
}

function graphViewport() {
		if (!graphViewportBounds) syncGraphViewport();
		return graphViewportBounds;
}

const graphChromeResizeObserver = typeof ResizeObserver === "function"
	? new ResizeObserver(() => {
		if (!syncGraphViewport()) return;
		if (!freeCamera) fitView(false);
		markCameraDirty();
	})
	: null;
for (const element of [sessionBar, toolbar, statusBar]) graphChromeResizeObserver?.observe(element);
syncGraphViewport();

function handleReducedMotionChange(event) {
	reducedMotion = event.matches;
	if (!reducedMotion) return;
	for (const node of nodes.values()) {
		node.pendingDiff = null;
		node.element.classList.remove("entered", "exited");
		markNodeMoving(node);
	}
	markCameraDirty();
	markFrameDirty();
}

reducedMotionQuery.addEventListener("change", handleReducedMotionChange);

function formatTokens(value) {
  if (!Number.isFinite(value)) return "?";
  if (value >= 1000000) return `${(value / 1000000).toFixed(1)}m`;
  if (value >= 1000) return `${(value / 1000).toFixed(1)}k`;
  return String(Math.round(value));
}

function setConnection(state, label) {
  const connection = $("#connection");
  connection.dataset.state = state;
  $("#connection-label").textContent = label;
}

function itemKey(item) {
  return String(item.id);
}

function timelineFrom(payload) {
  if (payload.timeline && Array.isArray(payload.timeline.history)) return payload.timeline;
  const items = payload.snapshot && Array.isArray(payload.snapshot.items) ? payload.snapshot.items : [];
  return {
    revision: payload.sequence || 0,
    history: items.map((item, order) => ({ ...item, order })),
    activeIds: items.map(itemKey),
    enteredIds: items.map(itemKey),
    retainedIds: [],
    exitedIds: [],
    observedIds: [],
    confirmedIds: [],
    pendingIds: [],
    summaryEdges: [],
  };
}

function clearGraph() {
  hideTooltip();
  closeDetail();
  for (const node of nodes.values()) {
    if (node.removeTimer) clearTimeout(node.removeTimer);
    node.element.remove();
  }
  nodes.clear();
  movingNodes.clear();
  for (const edge of edges.values()) edge.path.remove();
  edges.clear();
  dirtyEdges.clear();
  lastAnimatedRevision = -1;
}

function syncModeChrome() {
  document.body.dataset.mode = viewMode;
  $("#window-mode").setAttribute("aria-pressed", String(viewMode === "window"));
  $("#overview-mode").setAttribute("aria-pressed", String(viewMode === "overview"));
}

function saveSessionView() {
	  if (!selectedStreamId || !sessionStates.has(selectedStreamId)) return;
  sessionViews.set(selectedStreamId, {
    mode: viewMode,
    freeCamera,
    camera: { ...camera },
    cameraTarget: { ...cameraTarget },
  });
}

function restoreSessionView(streamId) {
  const saved = sessionViews.get(streamId);
  viewMode = saved ? saved.mode : "window";
  freeCamera = saved ? saved.freeCamera : false;
  camera = saved ? { ...saved.camera } : { x: 500, y: 420, scale: 0.8 };
  cameraTarget = saved ? { ...saved.cameraTarget } : { ...camera };
  markCameraDirty();
  syncModeChrome();
}

function setFollowActive(next) {
  followActive = Boolean(next);
  followToggle.checked = followActive;
  if (followActive && activeStreamId && sessionStates.has(activeStreamId)) {
    selectSession(activeStreamId);
  }
  renderSessionTabs();
}

function selectSession(streamId, manual = false) {
  if (!streamId || !sessionStates.has(streamId)) return;
  if (manual) {
    followActive = false;
    followToggle.checked = false;
  }
  unreadSessions.delete(streamId);
  if (selectedStreamId === streamId) {
    renderSessionTabs();
    return;
  }
	  if (selectedStreamId && sessionStates.has(selectedStreamId)) saveSessionView();
  clearGraph();
  selectedStreamId = streamId;
  restoreSessionView(streamId);
  currentPayload = null;
  applyPayload(sessionStates.get(streamId), false);
  renderSessionTabs();
}

function renderSessionTabs() {
  const existing = new Map([...sessionTabs.children].map((tab) => [tab.dataset.streamId, tab]));
  const wanted = new Set();
  for (const summary of sessionSummaries) {
    wanted.add(summary.streamId);
    let tab = existing.get(summary.streamId);
    if (!tab) {
      tab = document.createElement("button");
      tab.type = "button";
      tab.className = "session-tab";
      tab.setAttribute("role", "tab");
      tab.dataset.streamId = summary.streamId;
      const dot = document.createElement("i");
      dot.className = "session-dot";
      dot.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "session-tab-label";
      const process = document.createElement("span");
      process.className = "session-tab-process";
      tab.append(dot, label, process);
      tab.addEventListener("click", () => selectSession(tab.dataset.streamId, true));
    }
    tab.querySelector(".session-tab-label").textContent = summary.sessionLabel;
    tab.querySelector(".session-tab-process").textContent = summary.processLabel;
    tab.dataset.active = String(Boolean(summary.active));
    tab.dataset.connected = String(Boolean(summary.connected));
    tab.dataset.unread = String(unreadSessions.has(summary.streamId));
    tab.setAttribute("aria-selected", String(summary.streamId === selectedStreamId));
    tab.tabIndex = summary.streamId === selectedStreamId ? 0 : -1;
    tab.title = `${summary.sessionLabel} - ${summary.processLabel}${summary.active ? " - active in OMP" : ""}${summary.connected ? "" : " - process offline"}`;
    sessionTabs.appendChild(tab);
  }
  for (const [streamId, tab] of existing) {
    if (!wanted.has(streamId)) tab.remove();
  }
}

function emptyTimeline() {
  return {
    revision: 0,
    history: [],
    activeIds: [],
    enteredIds: [],
    retainedIds: [],
    exitedIds: [],
    observedIds: [],
    confirmedIds: [],
    pendingIds: [],
    summaryEdges: [],
  };
}

function summaryEdgeKey(edge) {
  return JSON.stringify([edge.kind, edge.from, edge.to]);
}

function applyRenderStatePatch(previous, patch) {
  const state = patch.reset || !previous
    ? { phase: "idle", activeTools: [], timeline: emptyTimeline() }
	    : { ...previous };

  if (Object.hasOwn(patch, "snapshot")) state.snapshot = patch.snapshot || undefined;
  if (patch.phase) state.phase = patch.phase;
  if (Array.isArray(patch.activeTools)) state.activeTools = [...patch.activeTools];
  if (patch.timeline === null) {
    delete state.timeline;
    return state;
  }
  if (!patch.timeline) return state;

  const timeline = patch.timeline.reset || !state.timeline
    ? emptyTimeline()
	    : { ...state.timeline };
	  const historyUpserts = patch.timeline.historyUpserts || [];
	  if (historyUpserts.length > 0) {
	    const history = new Map(timeline.history.map((item) => [item.id, item]));
	    for (const item of historyUpserts) history.set(item.id, structuredClone(item));
	    timeline.history = [...history.values()].sort((left, right) => left.order - right.order);
	  }

	  const summaryEdgeUpserts = patch.timeline.summaryEdgeUpserts || [];
	  if (summaryEdgeUpserts.length > 0) {
	    const summaryEdges = new Map(timeline.summaryEdges.map((edge) => [summaryEdgeKey(edge), edge]));
	    for (const edge of summaryEdgeUpserts) {
	      summaryEdges.set(summaryEdgeKey(edge), structuredClone(edge));
	    }
	    timeline.summaryEdges = [...summaryEdges.values()];
	  }
  if (Number.isFinite(patch.timeline.revision)) timeline.revision = patch.timeline.revision;
  for (const key of [
    "activeIds",
    "enteredIds",
    "retainedIds",
    "exitedIds",
    "observedIds",
    "confirmedIds",
    "pendingIds",
  ]) {
    if (Array.isArray(patch.timeline[key])) timeline[key] = [...patch.timeline[key]];
  }
  state.timeline = timeline;
  return state;
}

function decodeDeltaChunks(chunks) {
  const decoded = chunks.map(({ data }) => {
    const binary = atob(data);
    return Uint8Array.from(binary, (character) => character.charCodeAt(0));
  });
  const byteLength = decoded.reduce((total, chunk) => total + chunk.byteLength, 0);
  const bytes = new Uint8Array(byteLength);
  let offset = 0;
  for (const chunk of decoded) {
    bytes.set(chunk, offset);
    offset += chunk.byteLength;
  }
  const patch = JSON.parse(new TextDecoder().decode(bytes));
  if (!patch || typeof patch !== "object" || Array.isArray(patch)) {
    throw new Error("Invalid render state patch");
  }
  return patch;
}

function applyDelta(delta) {
  if (
    !delta
    || typeof delta.streamId !== "string"
    || typeof delta.transferId !== "string"
    || !Number.isSafeInteger(delta.index)
    || delta.index < 0
    || typeof delta.data !== "string"
    || typeof delta.complete !== "boolean"
  ) throw new Error("Invalid delta event");

  let transfer = deltaTransfers.get(delta.streamId);
  if (delta.index === 0) {
    transfer = { transferId: delta.transferId, chunks: [] };
    deltaTransfers.set(delta.streamId, transfer);
  } else if (
    !transfer
    || transfer.transferId !== delta.transferId
    || transfer.chunks.length !== delta.index
  ) {
    deltaTransfers.delete(delta.streamId);
    throw new Error("Delta events arrived out of order");
  }
  transfer.chunks.push({ data: delta.data });
  if (!delta.complete) return null;

  deltaTransfers.delete(delta.streamId);
  const patch = decodeDeltaChunks(transfer.chunks);
  const state = applyRenderStatePatch(sessionStates.get(delta.streamId), patch);
  sessionStates.set(delta.streamId, state);
  return { streamId: delta.streamId, state };
}

function shouldMarkUnread(payload, changed, selectedId) {
  return Boolean(changed && payload.activity !== false && changed.streamId !== selectedId);
}

function applyHubPayload(payload) {
	const focusedStreamId = document.activeElement?.classList?.contains("session-tab")
		? document.activeElement.dataset.streamId
		: null;
	const knownStreamIds = new Set([
		...sessionStates.keys(),
		...sessionViews.keys(),
		...unreadSessions,
		...deltaTransfers.keys(),
	]);
	if (payload.type === "bootstrap") {
		deltaTransfers.clear();
		sessionStates.clear();
	}
	const updatedStateIds = new Set();
	if (Array.isArray(payload.states)) {
		for (const entry of payload.states) {
			sessionStates.set(entry.streamId, entry.state);
			updatedStateIds.add(entry.streamId);
		}
	}
  if (payload.changed) deltaTransfers.delete(payload.changed.streamId);
  const changed = payload.delta ? applyDelta(payload.delta) : payload.changed;
	  if (changed) {
			sessionStates.set(changed.streamId, changed.state);
			if (shouldMarkUnread(payload, changed, selectedStreamId)) unreadSessions.add(changed.streamId);
	  }
	let available = new Set(sessionSummaries.map((summary) => summary.streamId));
	if (Array.isArray(payload.sessions)) {
		sessionSummaries = payload.sessions;
		available = new Set(sessionSummaries.map((summary) => summary.streamId));
		for (const streamId of sessionStates.keys()) knownStreamIds.add(streamId);
		for (const streamId of knownStreamIds) {
			if (available.has(streamId)) continue;
			sessionStates.delete(streamId);
			sessionViews.delete(streamId);
			unreadSessions.delete(streamId);
			deltaTransfers.delete(streamId);
		}
	}
	activeStreamId = payload.activeStreamId || null;
	if (detailSelection && !sessionStates.has(detailSelection.streamId)) closeDetail();

  let target = available.has(selectedStreamId) ? selectedStreamId : null;
  if (followActive) {
    target = activeStreamId && sessionStates.has(activeStreamId)
      ? activeStreamId
      : sessionSummaries.find((summary) => summary.active && sessionStates.has(summary.streamId))?.streamId || target;
  }
  target ||= sessionSummaries.find((summary) => sessionStates.has(summary.streamId))?.streamId || null;

	renderSessionTabs();
	if (target && target !== selectedStreamId) selectSession(target);
	else if (changed && changed.streamId === selectedStreamId) applyPayload(changed.state, true);
	else if (target && updatedStateIds.has(target)) applyPayload(sessionStates.get(target), false);
	else if (!target && selectedStreamId) {
		clearGraph();
		selectedStreamId = null;
		currentPayload = null;
		$("#empty-state").classList.remove("hidden");
	}

	if (focusedStreamId && !available.has(focusedStreamId)) {
		const replacement = [...sessionTabs.children]
			.find((tab) => tab.dataset.streamId === selectedStreamId);
		(replacement || followToggle).focus();
	}
}

function nodeText(item, index) {
  const meta = kindMeta[item.kind] || kindMeta.unknown;
  const state = item.pending ? "awaiting context" : item.active ? "active context" : "outside context";
  return {
    kind: meta.label,
    title: item.summary ? "Compaction summary" : item.toolName || meta.label,
    detail: item.toolName ? `${state} - ${item.toolName}` : `${state} - history ${index + 1}`,
  };
}

function nodeDimensions() {
		  return {
			  width: isMobileLayout() ? NODE_WIDTH_MOBILE : NODE_WIDTH_DESKTOP,
			  height: isShortLandscapeLayout() ? NODE_HEIGHT_SHORT_LANDSCAPE : NODE_HEIGHT,
		  };
}

function createNode(item, index, target, dimensions, revealAt = 0) {
	  const element = document.createElement("div");
	  element.className = "node";

  const kind = document.createElement("span");
  kind.className = "node-kind";
  const title = document.createElement("span");
  title.className = "node-title";
	  const detail = document.createElement("span");
	  detail.className = "node-detail";
	  element.append(kind, title, detail);

  const revealed = revealAt === 0;
  const node = {
    key: itemKey(item), item, index, element, kind, title, detail,
    x: target.x + (viewMode === "window" ? 180 : 0),
    y: target.y + 20,
    targetX: target.x,
    targetY: target.y,
    homeX: target.homeX,
    homeY: target.homeY,
    focusX: target.focusX,
    focusY: target.focusY,
	    width: dimensions.width,
	    height: dimensions.height,
    opacity: 0,
    targetOpacity: revealed ? 1 : 0,
    revealOpacity: 1,
    revealAt,
    revealed,
    pendingDiff: null,
    dragX: 0,
    dragY: 0,
    dragging: false,
    edgeKeys: new Set(),
    removeTimer: null,
  };

  if (!revealed) {
    element.classList.add("queued");
    element.setAttribute("aria-hidden", "true");
  }

  attachNodeInteraction(node);
  updateNodeContent(node, item, index);
  return node;
}

function updateNodeContent(node, item, index) {
	  const meta = kindMeta[item.kind] || kindMeta.unknown;
	  const text = nodeText(item, index);
	  const active = Boolean(item.active);
	  const pending = Boolean(item.pending);
	  const memory = item.kind === "memory";
	  node.item = item;
	  node.index = index;
	  if (
	    node.content
	    && node.content.color === meta.color
	    && node.content.kind === text.kind
	    && node.content.title === text.title
	    && node.content.detail === text.detail
	    && node.content.active === active
	    && node.content.pending === pending
	    && node.content.memory === memory
	  ) return;
	  node.content = { color: meta.color, kind: text.kind, title: text.title, detail: text.detail, active, pending, memory };
	  node.element.style.setProperty("--node-color", meta.color);
		node.element.classList.toggle("active", active);
		node.element.classList.toggle("inactive", !active && !pending);
		node.element.classList.toggle("pending-context", pending);
		node.element.classList.toggle("memory", memory);
	node.element.dataset.itemId = node.key;
	node.element.dataset.contextState = item.pending ? "pending" : item.active ? "active" : "history";
  node.kind.textContent = text.kind;
  node.title.textContent = text.title;
  node.detail.textContent = text.detail;
}

function homePosition(index) {
		  if (isShortLandscapeLayout()) {
			  const columns = 5;
			  const row = Math.floor(index / columns);
			  const offset = index % columns;
			  const column = row % 2 === 0 ? offset : columns - 1 - offset;
			  return { x: 210 + column * 190, y: 230 + row * 96 };
		  }
		  const mobile = isMobileLayout();
  const columns = mobile ? 2 : 6;
  const row = Math.floor(index / columns);
  const offset = index % columns;
  const column = row % 2 === 0 ? offset : columns - 1 - offset;
  return {
    x: (mobile ? 245 : 250) + column * (mobile ? 210 : 228),
    y: 720 + row * (mobile ? 146 : 158),
  };
}

function focusPosition(item, index, count, visibleCount = count) {
  const meta = kindMeta[item.kind] || kindMeta.unknown;
		  const compactColumns = shortLandscapeColumns(innerWidth, innerHeight, visibleCount);
		  if (compactColumns > 0) {
			  const row = Math.floor(index / compactColumns);
			  const offset = index % compactColumns;
			  const column = row % 2 === 0 ? offset : compactColumns - 1 - offset;
			  return {
				  x: 210 + column * 190,
				  y: 230 + row * 96 + meta.lane * 0.04,
			  };
		  }
		  if (isMobileLayout()) {
    const columns = count > 6 ? 2 : 1;
    const row = Math.floor(index / columns);
    const column = index % columns;
    return {
      x: columns === 1 ? 360 : 250 + column * 210,
      y: 245 + row * 132 + meta.lane * 0.06,
    };
  }
	const columns = Math.min(7, Math.max(1, count));
	const row = Math.floor(index / columns);
	const offset = index % columns;
	const column = row % 2 === 0 ? offset : columns - 1 - offset;
  return {
    x: 250 + column * 224,
    y: 285 + row * 146 + meta.lane * 0.35 + Math.sin(index * 1.4) * 8,
  };
}

function pendingPosition(item, index, count, activeCount) {
  const meta = kindMeta[item.kind] || kindMeta.unknown;
		  const compactColumns = shortLandscapeColumns(innerWidth, innerHeight, activeCount + count);
		  if (compactColumns > 0) {
			  const absoluteIndex = activeCount + index;
			  const row = Math.floor(absoluteIndex / compactColumns);
			  const offset = absoluteIndex % compactColumns;
			  const column = row % 2 === 0 ? offset : compactColumns - 1 - offset;
			  return {
				  x: 210 + column * 190,
				  y: 230 + row * 96 + meta.lane * 0.04,
			  };
		  }
		  if (isMobileLayout()) {
    const activeColumns = activeCount > 6 ? 2 : 1;
    const activeRows = Math.max(1, Math.ceil(activeCount / activeColumns));
    const columns = count > 4 ? 2 : 1;
    return {
      x: columns === 1 ? 360 : 250 + (index % columns) * 210,
      y: 245 + activeRows * 132 + 92 + Math.floor(index / columns) * 132 + meta.lane * 0.04,
    };
  }
  const activeColumns = Math.min(7, Math.max(1, activeCount));
  const activeRows = Math.max(1, Math.ceil(activeCount / activeColumns));
  const columns = Math.min(5, Math.max(1, count));
  return {
    x: 250 + (index % columns) * 224,
    y: 285 + activeRows * 146 + 82 + Math.floor(index / columns) * 138 + meta.lane * 0.16,
  };
}

function nodeLayout(item, historyIndex, activeIndex, activeCount, pendingIndex, pendingCount) {
  const home = homePosition(historyIndex);
	  const focus = activeIndex >= 0
		? focusPosition(item, activeIndex, activeCount, activeCount + pendingCount)
		: home;
  const pending = pendingIndex >= 0
    ? pendingPosition(item, pendingIndex, pendingCount, activeCount)
    : home;
  const target = viewMode === "window"
    ? activeIndex >= 0
      ? focus
      : pendingIndex >= 0
        ? pending
        : home
    : home;
  return {
    x: target.x,
    y: target.y,
    homeX: home.x,
    homeY: home.y,
    focusX: focus.x,
    focusY: focus.y,
    pendingX: pending.x,
    pendingY: pending.y,
  };
}

function flashDiff(node, diff) {
	  if (!diff || reducedMotion) return;
  node.element.classList.remove("entered", "exited");
  void node.element.offsetWidth;
  node.element.classList.add(diff);
	  setTimeout(() => node.element.classList.remove(diff), 680);
}

function revealNode(node) {
  node.revealed = true;
  node.revealAt = 0;
  node.targetOpacity = node.revealOpacity;
  node.element.classList.remove("queued");
  node.element.dataset.revealed = "true";
  if (node.element.dataset.revealOrder !== undefined) {
    node.element.dataset.revealedAt = String(Math.round(performance.now()));
  }
  node.element.removeAttribute("aria-hidden");
  if (node.pendingDiff) flashDiff(node, node.pendingDiff);
  node.pendingDiff = null;
}

function staggerStep(itemCount) {
  return itemCount > 1 ? Math.min(MAX_STAGGER_STEP_MS, MAX_STAGGER_TOTAL_MS / (itemCount - 1)) : 0;
}

function reconcileNodes(timeline, animateNew = false) {
	  const items = timeline.history || [];
	  const dimensions = nodeDimensions();
  const activeOrder = new Map((timeline.activeIds || []).map((id, index) => [String(id), index]));
  const activeIds = new Set(activeOrder.keys());
	const pendingKeys = (timeline.pendingIds || items.filter((item) => item.pending).map(itemKey)).map(String);
	const pendingOrder = new Map(pendingKeys.map((id, index) => [id, index]));
	const summaryTargets = new Set((timeline.summaryEdges || []).map((edge) => String(edge.to)));
  const enteredIds = new Set((timeline.enteredIds || []).map(String));
  const exitedIds = new Set((timeline.exitedIds || []).map(String));
	  const animateDiff = timeline.revision !== lastAnimatedRevision;
	  const newKeys = items.map(itemKey).filter((key) => !nodes.has(key));
	  const animateCreated = animateNew && animateDiff && !reducedMotion && newKeys.length <= MAX_ANIMATED_NODES;
	  let diffAnimationBudget = animateDiff && !reducedMotion ? MAX_ANIMATED_NODES : 0;
	  const step = animateCreated ? staggerStep(newKeys.length) : 0;
  const now = performance.now();
  const revealTimes = new Map(
    step > 0 ? newKeys.slice(1).map((key, index) => [key, now + (index + 1) * step]) : [],
  );
  const revealOrders = new Map(step > 0 ? newKeys.map((key, index) => [key, index]) : []);
  if (step > 0) {
    world.dataset.lastStaggerCount = String(newKeys.length);
    world.dataset.lastStaggerStep = String(Math.round(step));
    world.dataset.lastStaggerDuration = String(Math.round(step * (newKeys.length - 1)));
	  }
	  const wanted = new Set();
	  const newNodeFragment = document.createDocumentFragment();
	  let createdNodes = 0;
	  items.forEach((item, index) => {
    const key = itemKey(item);
    wanted.add(key);
	const activeIndex = activeOrder.get(key) ?? -1;
	const active = activeIds.has(key);
	const pendingIndex = pendingOrder.get(key) ?? -1;
	const pending = pendingIndex >= 0;
	const displayItem = { ...item, active, pending, summary: Boolean(item.synthetic) || summaryTargets.has(key) };
	const target = nodeLayout(
		displayItem,
		index,
		activeIndex,
		activeOrder.size,
		pendingIndex,
		pendingOrder.size,
	);
    let node = nodes.get(key);
    const created = !node;
	    if (!node) {
			node = createNode(displayItem, index, target, dimensions, revealTimes.get(key) || 0);
	      nodes.set(key, node);
	      newNodeFragment.appendChild(node.element);
	      createdNodes += 1;
		const revealOrder = revealOrders.get(key);
		if (revealOrder !== undefined) {
			node.element.dataset.revealOrder = String(revealOrder);
			node.element.dataset.revealed = String(node.revealed);
			if (node.revealed) node.element.dataset.revealedAt = String(Math.round(now));
		}
    } else {
      if (node.removeTimer) clearTimeout(node.removeTimer);
      node.removeTimer = null;
		if (node.revealed) {
			node.element.removeAttribute("aria-hidden");
		}
		updateNodeContent(node, displayItem, index);
    }
	node.homeX = target.homeX;
	node.homeY = target.homeY;
	node.focusX = target.focusX;
	node.focusY = target.focusY;
		node.pendingX = target.pendingX;
		node.pendingY = target.pendingY;
		if (node.width !== dimensions.width || node.height !== dimensions.height) {
			node.width = dimensions.width;
			node.height = dimensions.height;
			for (const edgeKey of node.edgeKeys) dirtyEdges.add(edgeKey);
		}
    node.targetX = target.x;
    node.targetY = target.y;
		node.revealOpacity = active ? 1 : pending ? (viewMode === "overview" ? 0.62 : 0.82) : viewMode === "overview" ? 0.38 : 0.2;
		if (node.revealed) node.targetOpacity = node.revealOpacity;
		if (created && !animateCreated) {
			node.x = node.targetX;
			node.y = node.targetY;
			node.opacity = node.targetOpacity;
		}
		const diff = enteredIds.has(key) ? "entered" : exitedIds.has(key) ? "exited" : null;
		if (diff && diffAnimationBudget > 0) {
			diffAnimationBudget -= 1;
			if (created && !node.revealed) node.pendingDiff = diff;
			else flashDiff(node, diff);
		}
    if (
      created
      || !node.revealed
      || differs(node.x, node.targetX, POSITION_EPSILON)
      || differs(node.y, node.targetY, POSITION_EPSILON)
      || differs(node.opacity, node.targetOpacity, OPACITY_EPSILON)
    ) markNodeMoving(node);
	  });
	  if (createdNodes > 0) world.appendChild(newNodeFragment);

  for (const [key, node] of nodes) {
    if (wanted.has(key) || node.removeTimer) continue;
    node.revealed = true;
    node.revealAt = 0;
    node.pendingDiff = null;
    node.targetOpacity = 0;
    node.targetX -= 170;
    node.targetY += 34;
    node.element.setAttribute("aria-hidden", "true");
    markNodeMoving(node);
    node.removeTimer = setTimeout(() => {
      movingNodes.delete(node);
      node.element.remove();
      nodes.delete(key);
    }, reducedMotion ? 20 : 720);
  }

	reconcileEdges(timeline, items, activeIds);
	updateBounds(timeline, items, activeOrder, pendingOrder);
	lastAnimatedRevision = timeline.revision;
}

function reconcileEdges(timeline, items, activeIds) {
	  const desired = new Set();
		const newEdgeFragment = document.createDocumentFragment();
		let createdEdges = 0;
		const addEdge = (from, to, type) => {
			if (!nodes.has(from) || !nodes.has(to)) return;
		const key = JSON.stringify([type, from, to]);
		desired.add(key);
		const isActive = activeIds.has(from) && activeIds.has(to);
		let edge = edges.get(key);
			if (!edge) {
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("class", `edge ${type} pending`);
					newEdgeFragment.appendChild(path);
					createdEdges += 1;
					edge = { key, from, to, type, path, active: null };
					edges.set(key, edge);
					dirtyEdges.add(key);
					nodes.get(from).edgeKeys.add(key);
					nodes.get(to).edgeKeys.add(key);
				}
				if (edge.active !== isActive) {
					edge.active = isActive;
					edge.path.classList.toggle("inactive", !isActive);
				}
			};
	const keys = items.map(itemKey);
  for (let index = 1; index < keys.length; index += 1) {
		addEdge(keys[index - 1], keys[index], "sequence");
  }
		for (const edge of timeline.summaryEdges || []) addEdge(String(edge.from), String(edge.to), "summary");
		if (createdEdges > 0) edgeGroup.appendChild(newEdgeFragment);

  for (const [key, edge] of edges) {
    if (desired.has(key)) continue;
    edge.path.classList.add("pending");
    setTimeout(() => edge.path.remove(), reducedMotion ? 20 : 280);
    nodes.get(edge.from)?.edgeKeys.delete(key);
    nodes.get(edge.to)?.edgeKeys.delete(key);
    dirtyEdges.delete(key);
    edges.delete(key);
  }
	if (dirtyEdges.size) scheduleRender();
}

function boundsFor(positions) {
  if (!positions.length) return { x: 180, y: 180, width: 520, height: 280 };
	  const compact = isShortLandscapeLayout();
	  const paddingX = compact ? 94 : 122;
	  const paddingY = compact ? 44 : 104;
	  const minX = Math.min(...positions.map((point) => point.x)) - paddingX;
	  const maxX = Math.max(...positions.map((point) => point.x)) + paddingX;
	  const minY = Math.min(...positions.map((point) => point.y)) - paddingY;
	  const maxY = Math.max(...positions.map((point) => point.y)) + paddingY;
  return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
}

function mergeBounds(left, right) {
  const minX = Math.min(left.x, right.x);
  const minY = Math.min(left.y, right.y);
  const maxX = Math.max(left.x + left.width, right.x + right.width);
  const maxY = Math.max(left.y + left.height, right.y + right.height);
  return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
}

function updateBounds(timeline, items, activeOrder, pendingOrder) {
  const homePositions = items.map((_, index) => homePosition(index));
	const itemsById = new Map(items.map((item) => [itemKey(item), item]));
	const visibleCount = activeOrder.size + pendingOrder.size;
	const focusPositions = (timeline.activeIds || []).map((id, index) => {
		const item = itemsById.get(String(id));
		return item ? focusPosition(item, index, activeOrder.size, visibleCount) : null;
  }).filter(Boolean);
	const pendingPositions = [...pendingOrder].map(([id, index]) => {
		const item = itemsById.get(id);
		return item ? pendingPosition(item, index, pendingOrder.size, activeOrder.size) : null;
	}).filter(Boolean);
	const activeBounds = boundsFor(focusPositions);
	const pendingBounds = pendingPositions.length ? boundsFor(pendingPositions) : null;
	const visibleBounds = viewMode === "window"
		? pendingBounds
			? mergeBounds(activeBounds, pendingBounds)
			: activeBounds
		: boundsFor(homePositions);
	const worldBounds = boundsFor([...homePositions, ...focusPositions, ...pendingPositions]);
	const maxX = worldBounds.x + worldBounds.width;
	const maxY = worldBounds.y + worldBounds.height;
	if (
		differs(frameTarget.x, activeBounds.x, POSITION_EPSILON)
		|| differs(frameTarget.y, activeBounds.y, POSITION_EPSILON)
		|| differs(frameTarget.width, activeBounds.width, POSITION_EPSILON)
		|| differs(frameTarget.height, activeBounds.height, POSITION_EPSILON)
	) {
		frameTarget = activeBounds;
		markFrameDirty();
	}
	fitTarget = visibleBounds;

  const worldWidth = Math.max(1000, maxX + 260);
  const worldHeight = Math.max(800, maxY + 240);
  world.style.width = `${worldWidth}px`;
  world.style.height = `${worldHeight}px`;
  edgeLayer.setAttribute("width", String(worldWidth));
  edgeLayer.setAttribute("height", String(worldHeight));
  if (!freeCamera) fitView(false);
}

function fitView(reset = true) {
  if (reset) freeCamera = false;
	  const compact = isShortLandscapeLayout();
	  const availableWidth = innerWidth - (compact ? 24 : 48);
		const viewport = graphViewport();
	  const padding = compact ? 32 : 100;
  const scale = Math.min(
	    availableWidth / Math.max(compact ? 180 : 320, fitTarget.width + padding),
		viewport.height / Math.max(compact ? 120 : 260, fitTarget.height + padding),
    1.12,
  );
  const nextTarget = {
    x: fitTarget.x + fitTarget.width / 2,
    y: fitTarget.y + fitTarget.height / 2 + 8,
	    scale: Math.max(MIN_CAMERA_SCALE, scale),
  };
	const targetChanged = differs(cameraTarget.x, nextTarget.x, POSITION_EPSILON)
		|| differs(cameraTarget.y, nextTarget.y, POSITION_EPSILON)
		|| differs(cameraTarget.scale, nextTarget.scale, SCALE_EPSILON);
	cameraTarget = nextTarget;
  if (reducedMotion) camera = { ...cameraTarget };
	if (targetChanged || cameraDirty) markCameraDirty();
}

function borderPoint(node, targetX, targetY) {
  const dx = targetX - node.renderX;
  const dy = targetY - node.renderY;
  if (!dx && !dy) return [node.renderX, node.renderY];
  const halfWidth = node.width / 2 + 6;
  const halfHeight = node.height / 2 + 6;
  const scale = Math.min(
    dx ? halfWidth / Math.abs(dx) : Number.POSITIVE_INFINITY,
    dy ? halfHeight / Math.abs(dy) : Number.POSITIVE_INFINITY,
    1,
  );
  return [node.renderX + dx * scale, node.renderY + dy * scale];
}

function updateEdge(edge) {
  const from = nodes.get(edge.from);
  const to = nodes.get(edge.to);
  if (!from || !to || from.renderX === undefined || to.renderX === undefined) return false;
  edge.path.classList.toggle("pending", !from.revealed || !to.revealed);
  const [startX, startY] = borderPoint(from, to.renderX, to.renderY);
  const [endX, endY] = borderPoint(to, from.renderX, from.renderY);
  const midX = (startX + endX) / 2;
  const curveSize = edge.type === "summary" ? 34 : 18;
  const curve = (from.index % 2 === 0 ? -1 : 1) * curveSize;
  edge.path.setAttribute("d", `M ${startX} ${startY} Q ${midX} ${(startY + endY) / 2 + curve} ${endX} ${endY}`);
  return true;
}

function renderFrame(time) {
  animationFrameId = null;
  animationFrameUsesTimeout = false;
  renderLoopActive = true;
  const settleImmediately = reducedMotion || document.hidden;
  const ease = settleImmediately ? 1 : 0.085;
  const opacityEase = settleImmediately ? 1 : 0.12;
  let nodeUpdates = 0;
  let edgeUpdates = 0;
  let keepAlive = false;

  const cameraMoving = cameraDirty
    || differs(camera.x, cameraTarget.x, POSITION_EPSILON)
    || differs(camera.y, cameraTarget.y, POSITION_EPSILON)
    || differs(camera.scale, cameraTarget.scale, SCALE_EPSILON);
	if (cameraMoving) {
		const viewport = graphViewport();
		camera.x = approach(camera.x, cameraTarget.x, ease, POSITION_EPSILON);
    camera.y = approach(camera.y, cameraTarget.y, ease, POSITION_EPSILON);
    camera.scale = approach(camera.scale, cameraTarget.scale, ease, SCALE_EPSILON);
		world.style.transform = `translate(${innerWidth / 2 - camera.x * camera.scale}px, ${viewport.centerY - camera.y * camera.scale}px) scale(${camera.scale})`;
    cameraDirty = false;
    if (
      differs(camera.x, cameraTarget.x, POSITION_EPSILON)
      || differs(camera.y, cameraTarget.y, POSITION_EPSILON)
      || differs(camera.scale, cameraTarget.scale, SCALE_EPSILON)
    ) keepAlive = true;
    else world.classList.remove("moving");
  }

  const frameMoving = frameDirty
    || differs(frameBox.x, frameTarget.x, POSITION_EPSILON)
    || differs(frameBox.y, frameTarget.y, POSITION_EPSILON)
    || differs(frameBox.width, frameTarget.width, POSITION_EPSILON)
    || differs(frameBox.height, frameTarget.height, POSITION_EPSILON);
  if (frameMoving) {
    frameBox.x = approach(frameBox.x, frameTarget.x, ease, POSITION_EPSILON);
    frameBox.y = approach(frameBox.y, frameTarget.y, ease, POSITION_EPSILON);
    frameBox.width = approach(frameBox.width, frameTarget.width, ease, POSITION_EPSILON);
    frameBox.height = approach(frameBox.height, frameTarget.height, ease, POSITION_EPSILON);
    windowFrame.setAttribute("x", String(frameBox.x));
    windowFrame.setAttribute("y", String(frameBox.y));
    windowFrame.setAttribute("width", String(frameBox.width));
    windowFrame.setAttribute("height", String(frameBox.height));
    frameDirty = false;
    if (
      differs(frameBox.x, frameTarget.x, POSITION_EPSILON)
      || differs(frameBox.y, frameTarget.y, POSITION_EPSILON)
      || differs(frameBox.width, frameTarget.width, POSITION_EPSILON)
      || differs(frameBox.height, frameTarget.height, POSITION_EPSILON)
    ) keepAlive = true;
  }

  const frameNodes = [...movingNodes];
  movingNodes.clear();
  for (const node of frameNodes) {
    if (nodes.get(node.key) !== node) continue;
    const previousRenderX = node.renderX;
    const previousRenderY = node.renderY;
    const previousOpacity = node.opacity;
    const wasRevealed = node.revealed;

    if (!node.revealed && (settleImmediately || time >= node.revealAt)) revealNode(node);
    if (node.revealed) {
      node.x = approach(node.x, node.targetX, ease, POSITION_EPSILON);
      node.y = approach(node.y, node.targetY, ease, POSITION_EPSILON);
    }
    node.opacity = approach(node.opacity, node.targetOpacity, opacityEase, OPACITY_EPSILON);
    if (!node.dragging) {
      node.dragX = approach(node.dragX, 0, opacityEase, POSITION_EPSILON);
      node.dragY = approach(node.dragY, 0, opacityEase, POSITION_EPSILON);
    }
    node.renderX = node.x + node.dragX;
    node.renderY = node.y + node.dragY;

    const geometryChanged = previousRenderX === undefined
      || previousRenderY === undefined
      || differs(previousRenderX, node.renderX, POSITION_EPSILON)
      || differs(previousRenderY, node.renderY, POSITION_EPSILON)
      || wasRevealed !== node.revealed;
    const opacityChanged = differs(previousOpacity, node.opacity, OPACITY_EPSILON);
    if (geometryChanged || opacityChanged) {
      node.element.style.opacity = String(node.opacity);
      node.element.style.transform = `translate(${node.renderX - node.width / 2}px, ${node.renderY - node.height / 2}px)`;
      nodeUpdates += 1;
    }
    if (geometryChanged) {
      for (const edgeKey of node.edgeKeys) dirtyEdges.add(edgeKey);
    }

    const waitingToReveal = !node.revealed && node.revealAt > time;
    const stillMoving = waitingToReveal
      || node.dragging
      || (node.revealed && (
        differs(node.x, node.targetX, POSITION_EPSILON)
        || differs(node.y, node.targetY, POSITION_EPSILON)
      ))
      || differs(node.opacity, node.targetOpacity, OPACITY_EPSILON)
      || (!node.dragging && (
        differs(node.dragX, 0, POSITION_EPSILON)
        || differs(node.dragY, 0, POSITION_EPSILON)
      ));
    if (stillMoving) {
      movingNodes.add(node);
      keepAlive = true;
    } else {
      node.element.classList.remove("moving");
    }
  }

  const frameEdges = [...dirtyEdges];
  dirtyEdges.clear();
  for (const edgeKey of frameEdges) {
    const edge = edges.get(edgeKey);
    if (edge && updateEdge(edge)) edgeUpdates += 1;
  }

  if (hoveredNode && (cameraMoving || nodeUpdates > 0)) positionTooltip(hoveredNode);

  renderStats.frames += 1;
  renderStats.totalNodeUpdates += nodeUpdates;
  renderStats.totalEdgeUpdates += edgeUpdates;
  renderStats.lastFrameNodeUpdates = nodeUpdates;
  renderStats.lastFrameEdgeUpdates = edgeUpdates;
  renderStats.peakFrameNodeUpdates = Math.max(renderStats.peakFrameNodeUpdates, nodeUpdates);
  renderStats.peakFrameEdgeUpdates = Math.max(renderStats.peakFrameEdgeUpdates, edgeUpdates);
  renderStats.lastFrameAt = time;

  if (keepAlive || movingNodes.size || dirtyEdges.size || cameraDirty || frameDirty) {
    scheduleRender();
  } else {
    renderLoopActive = false;
    renderStats.sleepingSince = time;
  }
}

function attachNodeInteraction(node) {
  let drag = null;
  node.element.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    drag = {
      x: event.clientX,
      y: event.clientY,
      originX: node.dragX,
      originY: node.dragY,
      moved: false,
      canOpen: event.button === 0 || event.pointerType === "touch",
    };
    node.dragging = true;
    markNodeMoving(node);
    try { node.element.setPointerCapture(event.pointerId); } catch (_) {}
  });
  node.element.addEventListener("pointermove", (event) => {
    if (!drag) return;
    if (Math.abs(event.clientX - drag.x) + Math.abs(event.clientY - drag.y) > 5) drag.moved = true;
    node.dragX = drag.originX + (event.clientX - drag.x) / camera.scale;
    node.dragY = drag.originY + (event.clientY - drag.y) / camera.scale;
    markNodeMoving(node);
  });
  const release = (open) => {
    const shouldOpen = Boolean(open && drag?.canOpen && !drag.moved);
    drag = null;
    node.dragging = false;
    markNodeMoving(node);
    if (shouldOpen) openDetail(node);
  };
  node.element.addEventListener("pointerup", () => release(true));
  node.element.addEventListener("pointercancel", () => release(false));
  node.element.addEventListener("pointerenter", () => showTooltip(node));
  node.element.addEventListener("pointerleave", hideTooltip);
}

function tooltipText(node) {
  const text = nodeText(node.item, node.index);
  return `${text.kind}\n${text.detail}`;
}

function showTooltip(node) {
  hoveredNode = node;
  tooltip.textContent = tooltipText(node);
  tooltip.classList.add("visible");
  positionTooltip(node);
}

function positionTooltip(node) {
  const bounds = node.element.getBoundingClientRect();
  const width = tooltip.offsetWidth;
  const height = tooltip.offsetHeight;
  let left = bounds.left + bounds.width / 2 - width / 2;
  let top = bounds.top - height - 10;
  left = Math.max(10, Math.min(innerWidth - width - 10, left));
  if (top < 10) top = bounds.bottom + 10;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function hideTooltip() {
  hoveredNode = null;
  tooltip.classList.remove("visible");
}

function detailSelectionMatches(selection, streamId, itemId) {
  return Boolean(
    selection
    && streamId
    && selection.streamId === streamId
    && selection.itemId === itemId
  );
}

function currentDetailItem() {
	if (!detailSelection || !currentPayload) return null;
	const detailItemId = detailSelection.itemId;
	if (!detailSelectionMatches(detailSelection, selectedStreamId, detailItemId)) return null;
  const timeline = timelineFrom(currentPayload);
  const item = timeline.history.find((entry) => itemKey(entry) === detailItemId);
  if (!item) return null;
  const active = (timeline.activeIds || []).map(String).includes(detailItemId);
  const pending = (timeline.pendingIds || []).map(String).includes(detailItemId) || Boolean(item.pending);
  const summary = Boolean(item.synthetic)
    || (timeline.summaryEdges || []).some((edge) => String(edge.to) === detailItemId);
  return { ...item, active, pending, summary };
}

function detailState(item) {
  if (item.pending) return "awaiting context";
  if (item.active) return "in current context";
  return "outside current context";
}

function prettyJson(value) {
  try {
    return JSON.stringify(JSON.parse(value), null, 2);
  } catch (_) {
    return value;
  }
}

function appendDetailBlock(item, block, index, modelRole) {
  const section = document.createElement("section");
  section.className = "detail-block";
  section.dataset.type = block.type;
  const label = document.createElement("span");
  label.className = "detail-block-label";
  section.appendChild(label);

  if (block.type === "image") {
	label.textContent = `${modelRole} - Image ${index + 1} - ${block.mimeType}`;
    if (/^image\/[a-z0-9.+-]+$/i.test(block.mimeType) && typeof block.data === "string") {
      const image = document.createElement("img");
      image.alt = `${item.kind} context image`;
      image.loading = "lazy";
      image.src = `data:${block.mimeType};base64,${block.data}`;
      section.appendChild(image);
    }
  } else {
    const text = document.createElement("pre");
	if (block.type === "toolCall") {
	  label.textContent = `${modelRole} - Tool call - ${block.name}`;
      text.textContent = prettyJson(block.argumentsJson);
	} else if (block.type === "thinking") {
	  label.textContent = block.redacted
	    ? `${modelRole} - Thinking - redacted`
	    : `${modelRole} - Thinking`;
      text.textContent = block.text;
	} else {
	  label.textContent = item.kind === "system"
	    ? `${modelRole} - System prompt`
	    : `${modelRole} - Content`;
      text.textContent = block.text;
    }
    section.appendChild(text);
  }
  detailContent.appendChild(section);
}

function syncDetailPanel() {
  const item = currentDetailItem();
  if (!item) {
    closeDetail();
    return;
  }
  const meta = kindMeta[item.kind] || kindMeta.unknown;
  const text = nodeText(item, item.order || 0);
  detailPanel.style.setProperty("--detail-color", meta.color);
  $("#detail-kind").textContent = `${text.kind} - OMP model context`;
  $("#detail-title").textContent = text.title;
  $("#detail-state").textContent = detailState(item);
  detailContent.replaceChildren();

	const modelMessages = Array.isArray(item.detail?.modelMessages)
	  ? item.detail.modelMessages
	  : [];
	const roles = [...new Set(modelMessages.map((message) => message.modelRole).filter(Boolean))];
	$("#detail-role").textContent = roles.join(" + ") || meta.label.toLowerCase();
	const blockCount = modelMessages.reduce(
	  (count, message) => count + (Array.isArray(message.blocks) ? message.blocks.length : 0),
	  0,
	);
	if (blockCount === 0) {
    const empty = document.createElement("p");
    empty.id = "detail-empty";
    empty.textContent = item.pending
      ? "Not yet confirmed by an OMP context event."
      : "No displayable content was exposed for this item.";
    detailContent.appendChild(empty);
	return;
  }
	let blockIndex = 0;
	for (const message of modelMessages) {
	  if (!Array.isArray(message.blocks)) continue;
	  for (const block of message.blocks) {
	    appendDetailBlock(item, block, blockIndex, message.modelRole);
	    blockIndex += 1;
	  }
	}
}

function openDetail(node) {
	if (!selectedStreamId) return;
	detailSelection = { streamId: selectedStreamId, itemId: node.key };
  hideTooltip();
  syncDetailPanel();
  document.body.dataset.detailOpen = "true";
  detailPanel.setAttribute("aria-hidden", "false");
  $("#detail-close").focus({ preventScroll: true });
}

function closeDetail() {
	detailSelection = null;
  document.body.dataset.detailOpen = "false";
  detailPanel.setAttribute("aria-hidden", "true");
	detailContent.replaceChildren();
}

detailBackdrop.addEventListener("click", closeDetail);
$("#detail-close").addEventListener("click", closeDetail);
addEventListener("keydown", (event) => {
	if (event.key === "Escape" && detailSelection) closeDetail();
});

const touches = new Map();
let pan = null;
let pinch = null;

viewport.addEventListener("pointerdown", (event) => {
  hideTooltip();
  touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (touches.size === 1) {
    pan = { x: event.clientX, y: event.clientY, cameraX: camera.x, cameraY: camera.y };
  } else if (touches.size === 2) {
    pan = null;
    const [a, b] = [...touches.values()];
    const middle = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pinch = {
      distance: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      scale: camera.scale,
      worldX: camera.x + (middle.x - innerWidth / 2) / camera.scale,
      worldY: camera.y + (middle.y - innerHeight / 2) / camera.scale,
    };
  }
  viewport.classList.add("dragging");
  try { viewport.setPointerCapture(event.pointerId); } catch (_) {}
});

viewport.addEventListener("pointermove", (event) => {
  if (!touches.has(event.pointerId)) return;
  touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pinch && touches.size >= 2) {
    freeCamera = true;
    const [a, b] = [...touches.values()];
    const middle = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
	    camera.scale = Math.min(2.4, Math.max(MIN_CAMERA_SCALE, pinch.scale * distance / pinch.distance));
    camera.x = pinch.worldX - (middle.x - innerWidth / 2) / camera.scale;
    camera.y = pinch.worldY - (middle.y - innerHeight / 2) / camera.scale;
    cameraTarget = { ...camera };
    markCameraDirty();
    return;
  }
  if (!pan) return;
  const deltaX = event.clientX - pan.x;
  const deltaY = event.clientY - pan.y;
  if (Math.abs(deltaX) + Math.abs(deltaY) > 3) freeCamera = true;
  if (freeCamera) {
    camera.x = pan.cameraX - deltaX / camera.scale;
    camera.y = pan.cameraY - deltaY / camera.scale;
    cameraTarget = { ...camera };
    markCameraDirty();
  }
});

function endPointer(event) {
  touches.delete(event.pointerId);
  if (touches.size < 2) pinch = null;
  if (touches.size === 1) {
    const [point] = [...touches.values()];
    pan = { x: point.x, y: point.y, cameraX: camera.x, cameraY: camera.y };
  } else if (touches.size === 0) {
    pan = null;
    viewport.classList.remove("dragging");
  }
}

viewport.addEventListener("pointerup", endPointer);
viewport.addEventListener("pointercancel", endPointer);
viewport.addEventListener("wheel", (event) => {
  event.preventDefault();
  freeCamera = true;
  const factor = Math.exp(-event.deltaY * 0.0012);
  const worldX = camera.x + (event.clientX - innerWidth / 2) / camera.scale;
  const worldY = camera.y + (event.clientY - innerHeight / 2) / camera.scale;
	  camera.scale = Math.min(2.4, Math.max(MIN_CAMERA_SCALE, camera.scale * factor));
  camera.x = worldX - (event.clientX - innerWidth / 2) / camera.scale;
  camera.y = worldY - (event.clientY - innerHeight / 2) / camera.scale;
  cameraTarget = { ...camera };
  markCameraDirty();
}, { passive: false });

function updateChrome(payload) {
  const snapshot = payload.snapshot;
	const timeline = timelineFrom(payload);
  document.body.dataset.phase = payload.phase || "idle";
  $("#phase").textContent = payload.activeTools && payload.activeTools.length
    ? payload.activeTools.join(", ")
    : payload.phase || "idle";
  $("#model").textContent = snapshot && snapshot.model ? snapshot.model : "no model";
	$("#item-count").textContent = `${timeline.activeIds.length} / ${timeline.history.length}`;

  const percent = snapshot && Number.isFinite(snapshot.percent) ? Math.min(100, snapshot.percent) : 0;
  const fill = $("#usage-fill");
  fill.style.width = `${percent}%`;
  fill.dataset.level = percent >= 90 ? "critical" : percent >= 72 ? "high" : "normal";
  $("#usage-track").setAttribute("aria-valuenow", String(Math.round(percent)));
  $("#usage-value").textContent = snapshot
    ? `${formatTokens(snapshot.tokens)} / ${formatTokens(snapshot.contextWindow)} - ${Math.round(percent)}%`
    : "? / ?";
}

function applyPayload(payload, animateNew = false) {
  currentPayload = payload;
  updateChrome(payload);
	const timeline = timelineFrom(payload);
	$("#empty-state").classList.toggle("hidden", timeline.history.length > 0);
	reconcileNodes(timeline, animateNew);
	if (detailSelection) syncDetailPanel();
}

function setMode(mode) {
  viewMode = mode;
  syncModeChrome();
  freeCamera = false;
  if (currentPayload) applyPayload(currentPayload);
}

$("#window-mode").addEventListener("click", () => setMode("window"));
$("#overview-mode").addEventListener("click", () => setMode("overview"));
$("#fit-view").addEventListener("click", () => fitView(true));
followToggle.addEventListener("change", () => setFollowActive(followToggle.checked));
sessionTabs.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  const tabs = [...sessionTabs.querySelectorAll(".session-tab")];
  const index = tabs.findIndex((tab) => tab.dataset.streamId === selectedStreamId);
  if (index < 0 || tabs.length < 2) return;
  event.preventDefault();
  const offset = event.key === "ArrowRight" ? 1 : -1;
  const next = tabs[(index + offset + tabs.length) % tabs.length];
  selectSession(next.dataset.streamId, true);
  next.focus();
});
addEventListener("resize", () => {
	syncGraphViewport();
  if (currentPayload) applyPayload(currentPayload);
  if (!freeCamera) fitView(false);
  markCameraDirty();
});

function demoPayload() {
	const kinds = ["system", "user", "assistant", "tool", "assistant", "user", "assistant", "tool", "user", "assistant", "tool", "assistant", "user", "assistant", "tool", "assistant", "user", "assistant", "memory", "user", "assistant", "tool", "assistant"];
	const history = kinds.map((kind, index) => ({
		id: kind === "system" ? "system-prompt" : kind === "memory" ? "memory-18" : `message-${index}`,
		kind,
		order: index,
		firstSeenAt: Date.now() - (kinds.length - index) * 1000,
		lastSeenAt: Date.now(),
		...(kind === "tool" ? { toolName: index === 3 ? "read" : index === 7 ? "bash" : "search" } : {}),
		detail: {
			sourceRole: kind === "tool" ? "toolResult" : kind,
			modelMessages: [{
				modelRole: kind === "system" ? "system" : kind === "assistant" ? "assistant" : kind === "tool" ? "toolResult" : "user",
				blocks: [{
					type: "text",
					text: kind === "system"
						? "You are a helpful coding agent working inside the current project."
						: kind === "tool"
							? `Tool result ${index}: context-rail preview output.`
							: `${kind} context item ${index}.`,
				}],
			}],
		},
	}));
	const activeIds = ["system-prompt", "memory-18", ...history.slice(-4).map(itemKey)];
  return {
    sequence: 1,
    publishedAt: Date.now(),
    phase: "context",
    activeTools: [],
    snapshot: {
      createdAt: Date.now(),
      model: "claude-sonnet-4.5",
      tokens: 78240,
      contextWindow: 200000,
      percent: 39.12,
		items: history.filter((item) => activeIds.includes(item.id)).map(({ id, kind, toolName }) => ({
			id,
			kind,
			...(toolName ? { toolName } : {}),
		})),
    },
			timeline: {
				revision: 7,
				history,
				activeIds,
				enteredIds: ["memory-18", ...history.slice(-4).map(itemKey)],
				retainedIds: ["system-prompt"],
				exitedIds: history.slice(1, 18).map(itemKey),
				observedIds: [],
				confirmedIds: [],
				pendingIds: [],
				summaryEdges: history.slice(1, 18).map((item) => ({ from: item.id, to: "memory-18", kind: "summary" })),
			},
  };
}

const EVENT_SOURCE_RECONNECT_DELAY_MS = 250;
let eventSource = null;
let eventReconnectTimer = null;

function restartEventSourceAfterInvalidData(source) {
	if (eventSource !== source) return;
	source.close();
	eventSource = null;
	deltaTransfers.clear();
	setConnection("offline", "invalid data");
	if (eventReconnectTimer !== null) clearTimeout(eventReconnectTimer);
	eventReconnectTimer = setTimeout(() => {
		eventReconnectTimer = null;
		connectEventSource();
	}, EVENT_SOURCE_RECONNECT_DELAY_MS);
}

function handleEventSourceMessage(source, event, apply) {
	if (eventSource !== source) return;
	try {
		apply(JSON.parse(event.data));
		setConnection("live", "live");
	} catch (_) {
		restartEventSourceAfterInvalidData(source);
	}
}

function applyLegacySnapshot(state) {
	const timeline = timelineFrom(state);
	applyHubPayload({
		activeStreamId: "legacy:default",
		sessions: [{
			streamId: "legacy:default",
			processId: "legacy",
			processLabel: "OMP",
			sessionId: "default",
			sessionLabel: "Current session",
			active: true,
			connected: true,
			phase: state.phase || "idle",
			model: state.snapshot && state.snapshot.model,
